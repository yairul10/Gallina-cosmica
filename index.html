<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nave Gallina vs Maíces Malvados</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #020617;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 640px;
            background: #0f172a;
            box-shadow: 0 25px 35px -5px rgb(0 0 0 / 0.9);
            overflow: hidden;
            border-radius: 20px;
            border: 3px solid #334155;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #090d16;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            pointer-events: none;
        }

        .header-score {
            display: flex;
            justify-content: space-between;
            font-size: 1.15rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .fire-button-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            pointer-events: auto;
            z-index: 5;
        }

        .btn-fire {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border: 3px solid #fee2e2;
            border-radius: 50%;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.5);
            transition: transform 0.08s;
        }

        .btn-fire:active {
            transform: scale(0.9);
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            pointer-events: auto;
            z-index: 10;
        }

        .screen-overlay h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .screen-overlay p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="header-score">
                <div>Puntos: <span id="scoreVal">0</span></div>
                <div>Vidas: <span id="livesVal">❤️ ❤️ ❤️</span></div>
            </div>
        </div>

        <div class="fire-button-container">
            <button class="btn-fire" id="fireBtn">🚀</button>
        </div>

        <!-- Pantalla de Inicio -->
        <div id="startScreen" class="screen-overlay">
            <h1>🐔 Nave Gallina Espacial</h1>
            <p>¡Pilota la nave nodriza con forma de gallina y defiende el espacio de los maíces malvados!</p>
            <button class="btn" id="startBtn">¡Despegar!</button>
        </div>

        <!-- Pantalla de Game Over -->
        <div id="gameOverScreen" class="screen-overlay" style="display: none;">
            <h1>¡Nave Destruida!</h1>
            <p>Los maíces conquistaron el sector.<br>Puntuación final: <strong id="finalScore">0</strong></p>
            <button class="btn" id="restartBtn">Reintentar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 420;
        canvas.height = 640;

        let score = 0;
        let lives = 3;
        let gameState = 'START';

        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 90,
            width: 50,
            height: 50,
            speed: 6.5
        };

        let bullets = [];
        let enemies = [];
        let stars = [];

        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 0.8 + 0.3
            });
        }

        let keys = { ArrowLeft: false, ArrowRight: false, KeyA: false, KeyD: false };

        window.addEventListener('keydown', (e) => {
            if (e.code in keys) keys[e.code] = true;
            if (e.code === 'Space' && gameState === 'PLAYING') {
                shootBullet();
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code in keys) keys[e.code] = false;
        });

        let isDragging = false;
        canvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            movePlayerToTouch(e);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (isDragging) movePlayerToTouch(e);
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        function movePlayerToTouch(e) {
            const rect = canvas.getBoundingClientRect();
            const touchX = (e.clientX - rect.left) * (canvas.width / rect.width);
            player.x = touchX - player.width / 2;
        }

        document.getElementById('fireBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (gameState === 'PLAYING') {
                shootBullet();
            }
        });

        function shootBullet() {
            bullets.push({
                x: player.x + player.width / 2 - 8,
                y: player.y - 10,
                width: 16,
                height: 16,
                speed: 10
            });
        }

        function spawnEnemy() {
            const size = 48;
            const x = Math.random() * (canvas.width - size - 20) + 10;
            enemies.push({
                x: x,
                y: -60,
                width: size,
                height: size,
                speed: 1.5 + Math.random() * 1.5,
                wobble: Math.random() * Math.PI
            });
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        function startGame() {
            score = 0;
            lives = 3;
            bullets = [];
            enemies = [];
            player.x = canvas.width / 2 - player.width / 2;
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('livesVal').textContent = '❤️ ❤️ ❤️';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            gameState = 'PLAYING';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        let enemySpawnInterval = 0;
        function update() {
            if (gameState !== 'PLAYING') return;

            if (keys.ArrowLeft || keys.KeyA) player.x -= player.speed;
            if (keys.ArrowRight || keys.KeyD) player.x += player.speed;

            if (player.x < 10) player.x = 10;
            if (player.x > canvas.width - player.width - 10) player.x = canvas.width - player.width - 10;

            for (let s of stars) {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < -20) bullets.splice(i, 1);
            }

            enemySpawnInterval++;
            if (enemySpawnInterval > 42) {
                spawnEnemy();
                enemySpawnInterval = 0;
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;
                enemies[i].wobble += 0.05;
                enemies[i].x += Math.sin(enemies[i].wobble) * 0.8;

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) gameOver();
                    continue;
                }

                if (
                    player.x < enemies[i].x + enemies[i].width &&
                    player.x + player.width > enemies[i].x &&
                    player.y < enemies[i].y + enemies[i].height &&
                    player.y + player.height > enemies[i].y
                ) {
                    enemies.splice(i, 1);
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) gameOver();
                    continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j] &&
                        bullets[j].x < enemies[i].x + enemies[i].width &&
                        bullets[j].x + bullets[j].width > enemies[i].x &&
                        bullets[j].y < enemies[i].y + enemies[i].height &&
                        bullets[j].y + bullets[j].height > enemies[i].y
                    ) {
                        score += 100;
                        document.getElementById('scoreVal').textContent = score;
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }
            }
        }

        function updateLivesUI() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️ ';
            document.getElementById('livesVal').textContent = hearts.trim();
        }

        function drawChickenShip(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Fuego del propulsor trasero
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(16, 42, 6, 10);
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(18, 45, 2, 6);

            // Alas laterales de la nave espacial (metálicas)
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.moveTo(8, 25);
            ctx.lineTo(-2, 38);
            ctx.lineTo(16, 32);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(42, 25);
            ctx.lineTo(52, 38);
            ctx.lineTo(34, 32);
            ctx.fill();

            // Fuselaje principal en forma de cuerpo de gallina
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.ellipse(25, 26, 16, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();

            // Cabina redonda frontal (tipo domo de cristal tecnológico)
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(25, 17, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#0284c7';
            ctx.stroke();

            // Pico de la nave (hacia arriba)
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(21, 8);
            ctx.lineTo(29, 8);
            ctx.lineTo(25, 0);
            ctx.fill();

            // Cresta galáctica roja arriba
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(22, 2, 3.5, 0, Math.PI * 2);
            ctx.arc(27, 1, 4.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawEvilCorn(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Cuerpo del maíz malvado (amarillo degradado/cálido)
            ctx.fillStyle = '#eab308';
            ctx.beginPath();
            ctx.roundRect(4, 6, 40, 42, [12, 12, 18, 18]);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#854d0e';
            ctx.stroke();

            // Hojas inferiores verdes puntiagudas (armadura)
            ctx.fillStyle = '#166534';
            ctx.beginPath();
            ctx.moveTo(4, 32);
            ctx.lineTo(-4, 48);
            ctx.lineTo(16, 40);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(44, 32);
            ctx.lineTo(52, 48);
            ctx.lineTo(32, 40);
            ctx.fill();

            // Ojos furiosos (rojos)
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(11, 16, 9, 6);
            ctx.fillRect(28, 16, 9, 6);
            
            // Pupilas negras enojadas
            ctx.fillStyle = '#000000';
            ctx.fillRect(15, 17, 3, 4);
            ctx.fillRect(31, 17, 3, 4);

            // Cejas fruncidas
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(9, 13); ctx.lineTo(22, 18);
            ctx.moveTo(39, 13); ctx.lineTo(26, 18);
            ctx.stroke();

            // Boca malvada con dientes afilados
            ctx.fillStyle = '#451a03';
            ctx.beginPath();
            ctx.fillRect(14, 32, 20, 7);
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(16, 32, 3, 3);
            ctx.fillRect(22, 32, 3, 3);
            ctx.fillRect(28, 32, 3, 3);

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            for (let s of stars) {
                ctx.fillRect(s.x, s.y, s.size, s.size);
            }

            // Dibuja la nave de gallina real
            drawChickenShip(player.x, player.y);

            // Proyectiles (Pollitos tiernos saliendo disparados)
            for (let b of bullets) {
                ctx.font = '22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐥', b.x + b.width / 2, b.y + b.height / 2);
            }

            // Enemigos (Maíces malvados dibujados)
            for (let e of enemies) {
                drawEvilCorn(e.x, e.y);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
