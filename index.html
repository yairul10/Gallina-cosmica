<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nave Gallina vs Maíces Malvados</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #020617;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 640px;
            background: #0f172a;
            box-shadow: 0 25px 35px -5px rgb(0 0 0 / 0.9);
            overflow: hidden;
            border-radius: 20px;
            border: 3px solid #334155;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #090d16;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            pointer-events: none;
        }

        .header-score {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .controls-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
            margin-bottom: 5px;
        }

        .upgrades-panel {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 200px;
        }

        .upgrade-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 4px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s;
        }

        .upgrade-btn:hover:not(:disabled) {
            background: #334155;
        }

        .upgrade-btn:disabled {
            border-color: #64748b;
            color: #64748b;
            cursor: default;
        }

        .fire-button-container {
            pointer-events: auto;
        }

        .btn-fire {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border: 3px solid #fee2e2;
            border-radius: 50%;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.5);
            transition: transform 0.08s;
        }

        .btn-fire:active {
            transform: scale(0.9);
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            pointer-events: auto;
            z-index: 10;
        }

        .screen-overlay h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .screen-overlay p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="header-score">
                <div>Pts: <span id="scoreVal">0</span> | 🪙 <span id="coinVal">0</span></div>
                <div>Vidas: <span id="livesVal">❤️ ❤️ ❤️</span></div>
            </div>

            <div class="controls-hud">
                <div class="upgrades-panel" id="upgradesPanel">
                    <button class="upgrade-btn" id="upgBullets" onclick="buyUpgrade('bullets')">Daño/Disparo (Lv.0)</button>
                    <button class="upgrade-btn" id="upgSpeed" onclick="buyUpgrade('speed')">Velocidad (Lv.1)</button>
                    <button class="upgrade-btn" id="upgLife" onclick="buyUpgrade('life')">+1 Vida [🪙15]</button>
                    <button class="upgrade-btn" id="upgEvolve" onclick="buyUpgrade('evolve')" style="display:none; border-color:#fbbf24; color:#fbbf24;">🌟 Evolucionar</button>
                </div>

                <div class="fire-button-container">
                    <button class="btn-fire" id="fireBtn">🚀</button>
                </div>
            </div>
        </div>

        <!-- Pantalla de Inicio -->
        <div id="startScreen" class="screen-overlay">
            <h1>🐔 Granja Espacial Épica</h1>
            <p>¡Hasta 3 balas por disparo con daño progresivo! Evoluciona: Gallina ➔ Oveja (Lv.6) ➔ Caballo (Lv.10) ➔ Vaca. ¡Los maíces endurecen su vida!</p>
            <button class="btn" id="startBtn">¡Despegar!</button>
        </div>

        <!-- Pantalla de Game Over -->
        <div id="gameOverScreen" class="screen-overlay" style="display: none;">
            <h1>¡Nave Destruida!</h1>
            <p>Puntuación final: <strong id="finalScore">0</strong></p>
            <button class="btn" id="restartBtn">Reintentar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 420;
        canvas.height = 640;

        let score = 0;
        let coins = 0;
        let lives = 3;
        let gameTime = 0;
        let gameState = 'START';
        
        // Fases de evolución: 0 = Gallina, 1 = Oveja, 2 = Caballo, 3 = Vaca
        let evolutionStage = 0; 
        let maxUpgradeLimit = 3; 
        let nextBossScoreThreshold = 5000;

        let upgrades = {
            bullets: 0, // Máximo 3 (Cantidad fija de balas, aumenta el daño)
            speed: 1
        };

        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 110,
            width: 50,
            height: 50,
            baseSpeed: 5.5
        };

        let bullets = [];
        let enemies = [];
        let bossBullets = [];
        let boss = null;
        let stars = [];

        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 0.8 + 0.3
            });
        }

        let keys = { ArrowLeft: false, ArrowRight: false, KeyA: false, KeyD: false };

        window.addEventListener('keydown', (e) => {
            if (e.code in keys) keys[e.code] = true;
            if (e.code === 'Space' && gameState === 'PLAYING') {
                shootBullet();
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code in keys) keys[e.code] = false;
        });

        let isDragging = false;
        canvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            movePlayerToTouch(e);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (isDragging) movePlayerToTouch(e);
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        function movePlayerToTouch(e) {
            const rect = canvas.getBoundingClientRect();
            const touchX = (e.clientX - rect.left) * (canvas.width / rect.width);
            player.x = touchX - player.width / 2;
        }

        document.getElementById('fireBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (gameState === 'PLAYING') {
                shootBullet();
            }
        });

        function shootBullet() {
            let bulletSpeed = 10;
            let widthSize = 16;
            let heightSize = 16;
            let bType = 'chick';
            if (evolutionStage === 1) bType = 'wool';
            if (evolutionStage === 2) bType = 'horseshoe';
            if (evolutionStage === 3) bType = 'milk';

            // El daño de cada bala aumenta conforme sube el nivel de mejora (Nv.1 = 1 de daño, Nv.2 = 2, Nv.3 = 3...)
            let bulletDamage = upgrades.bullets === 0 ? 1 : upgrades.bullets;

            if (upgrades.bullets >= 2) {
                // Máximo de 3 balas simultáneas en abanico
                bullets.push({ x: player.x + 4, y: player.y - 10, width: widthSize, height: heightSize, speed: bulletSpeed, dx: -1.2, type: bType, damage: bulletDamage });
                bullets.push({ x: player.x + player.width / 2 - 8, y: player.y - 14, width: widthSize, height: heightSize, speed: bulletSpeed, dx: 0, type: bType, damage: bulletDamage });
                bullets.push({ x: player.x + player.width - 20, y: player.y - 10, width: widthSize, height: heightSize, speed: bulletSpeed, dx: 1.2, type: bType, damage: bulletDamage });
            } else if (upgrades.bullets === 1) {
                bullets.push({ x: player.x + 8, y: player.y - 10, width: widthSize, height: heightSize, speed: bulletSpeed, dx: 0, type: bType, damage: bulletDamage });
                bullets.push({ x: player.x + player.width - 24, y: player.y - 10, width: widthSize, height: heightSize, speed: bulletSpeed, dx: 0, type: bType, damage: bulletDamage });
            } else {
                bullets.push({ x: player.x + player.width / 2 - 8, y: player.y - 10, width: widthSize, height: heightSize, speed: bulletSpeed, dx: 0, type: bType, damage: bulletDamage });
            }
        }

        window.buyUpgrade = function(type) {
            if (type === 'bullets' && upgrades.bullets < maxUpgradeLimit && coins >= 3) {
                coins -= 3;
                upgrades.bullets++;
            } else if (type === 'speed' && upgrades.speed < maxUpgradeLimit && coins >= 3) {
                coins -= 3;
                upgrades.speed++;
            } else if (type === 'life' && coins >= 15) {
                coins -= 15;
                lives++;
                updateLivesUI();
            } else if (type === 'evolve') {
                if (evolutionStage === 0) {
                    evolutionStage = 1; // Oveja
                    maxUpgradeLimit = 6; 
                } else if (evolutionStage === 1) {
                    evolutionStage = 2; // Caballo
                    maxUpgradeLimit = 10; 
                } else if (evolutionStage === 2) {
                    evolutionStage = 3; // Vaca (forma máxima)
                    maxUpgradeLimit = 10;
                }
                document.getElementById('upgEvolve').style.display = 'none';
            }
            updateUpgradesHUD();
        }

        function updateUpgradesHUD() {
            document.getElementById('coinVal').textContent = coins;
            document.getElementById('upgBullets').textContent = upgrades.bullets >= maxUpgradeLimit ? 'Daño Disparos: MÁX' : `Daño/Disparos [🪙3] (Lv.${upgrades.bullets})`;
            document.getElementById('upgSpeed').textContent = upgrades.speed >= maxUpgradeLimit ? 'Velocidad: MÁX' : `Velocidad [🪙3] (Lv.${upgrades.speed})`;
            document.getElementById('upgLife').textContent = `+1 Vida [🪙15]`;

            let evolveBtn = document.getElementById('upgEvolve');
            if (upgrades.bullets >= maxUpgradeLimit && upgrades.speed >= maxUpgradeLimit) {
                if (evolutionStage === 0) {
                    evolveBtn.style.display = 'block';
                    evolveBtn.textContent = '🌟 Evolucionar a Oveja';
                } else if (evolutionStage === 1) {
                    evolveBtn.style.display = 'block';
                    evolveBtn.textContent = '🌟 Evolucionar a Caballo';
                } else if (evolutionStage === 2) {
                    evolveBtn.style.display = 'block';
                    evolveBtn.textContent = '🌟 Evolucionar a Vaca';
                } else {
                    evolveBtn.style.display = 'none';
                }
            } else {
                evolveBtn.style.display = 'none';
            }
        }

        function spawnEnemy() {
            if (boss) return;
            const size = 48;
            const x = Math.random() * (canvas.width - size - 20) + 10;
            let speedMultiplier = 1 + (gameTime / 30); 

            // A partir de la evolución de la Vaca (Stage 3), los maíces tienen más vida base
            let baseCornHp = evolutionStage >= 3 ? 3 : 1;

            enemies.push({
                x: x,
                y: -60,
                width: size,
                height: size,
                hp: baseCornHp,
                maxHp: baseCornHp,
                speed: (1.5 + Math.random() * 1.5) * speedMultiplier,
                wobble: Math.random() * Math.PI
            });
        }

        function spawnBoss() {
            // Los jefes acumulan cada vez más vida de forma progresiva por cada aparición
            let bossLevel = Math.floor(score / 5000);
            let bossHp = 60 + (bossLevel * 45);

            boss = {
                x: canvas.width / 2 - 60,
                y: -100,
                width: 120,
                height: 100,
                maxHp: bossHp,
                hp: bossHp,
                speed: 1.5 + (bossLevel * 0.1),
                direction: 1,
                shootCooldown: 0
            };
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        function startGame() {
            score = 0;
            coins = 0;
            lives = 3;
            gameTime = 0;
            bullets = [];
            enemies = [];
            bossBullets = [];
            boss = null;
            evolutionStage = 0;
            maxUpgradeLimit = 3;
            nextBossScoreThreshold = 5000;
            upgrades.bullets = 0;
            upgrades.speed = 1;
            player.x = canvas.width / 2 - player.width / 2;
            
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('upgEvolve').style.display = 'none';
            updateLivesUI();
            updateUpgradesHUD();

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            gameState = 'PLAYING';

            if (window.gameTimerInterval) clearInterval(window.gameTimerInterval);
            window.gameTimerInterval = setInterval(() => {
                if (gameState === 'PLAYING') {
                    gameTime++;
                }
            }, 1000);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            clearInterval(window.gameTimerInterval);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        let enemySpawnInterval = 0;
        function update() {
            if (gameState !== 'PLAYING') return;

            if (score >= nextBossScoreThreshold && !boss) {
                spawnBoss();
                nextBossScoreThreshold += 5000;
            }

            let currentSpeed = player.baseSpeed + (upgrades.speed - 1) * 0.5;
            if (keys.ArrowLeft || keys.KeyA) player.x -= currentSpeed;
            if (keys.ArrowRight || keys.KeyD) player.x += currentSpeed;

            if (player.x < 10) player.x = 10;
            if (player.x > canvas.width - player.width - 10) player.x = canvas.width - player.width - 10;

            for (let s of stars) {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].dx) bullets[i].x += bullets[i].dx;
                if (bullets[i].y < -20) bullets.splice(i, 1);
            }

            for (let i = bossBullets.length - 1; i >= 0; i--) {
                bossBullets[i].y += bossBullets[i].speed;
                if (bossBullets[i].y > canvas.height + 20) {
                    bossBullets.splice(i, 1);
                    continue;
                }
                if (
                    player.x < bossBullets[i].x + bossBullets[i].width &&
                    player.x + player.width > bossBullets[i].x &&
                    player.y < bossBullets[i].y + bossBullets[i].height &&
                    player.y + player.height > bossBullets[i].y
                ) {
                    bossBullets.splice(i, 1);
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) gameOver();
                }
            }

            if (!boss) {
                enemySpawnInterval++;
                let spawnLimit = Math.max(20, 45 - Math.floor(gameTime / 10));
                if (enemySpawnInterval > spawnLimit) {
                    spawnEnemy();
                    enemySpawnInterval = 0;
                }
            }

            if (boss) {
                if (boss.y < 50) boss.y += 1;
                boss.x += boss.speed * boss.direction;
                if (boss.x < 10 || boss.x + boss.width > canvas.width - 10) {
                    boss.direction *= -1;
                }

                boss.shootCooldown++;
                if (boss.shootCooldown >= 35) {
                    boss.shootCooldown = 0;
                    bossBullets.push({
                        x: boss.x + boss.width / 2 - 6,
                        y: boss.y + boss.height,
                        width: 12,
                        height: 12,
                        speed: 5.5
                    });
                }
            }

            // Actualizar enemigos normales
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;
                enemies[i].wobble += 0.05;
                enemies[i].x += Math.sin(enemies[i].wobble) * 0.8;

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) gameOver();
                    continue;
                }

                if (
                    player.x < enemies[i].x + enemies[i].width &&
                    player.x + player.width > enemies[i].x &&
                    player.y < enemies[i].y + enemies[i].height &&
                    player.y + player.height > enemies[i].y
                ) {
                    enemies.splice(i, 1);
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) gameOver();
                    continue;
                }

                // Colisión Bala vs Enemigo (aplicando daño progresivo)
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j] &&
                        bullets[j].x < enemies[i].x + enemies[i].width &&
                        bullets[j].x + bullets[j].width > enemies[i].x &&
                        bullets[j].y < enemies[i].y + enemies[i].height &&
                        bullets[j].y + bullets[j].height > enemies[i].y
                    ) {
                        enemies[i].hp -= bullets[j].damage;
                        bullets.splice(j, 1);

                        if (enemies[i].hp <= 0) {
                            score += 100;
                            coins += 1;
                            document.getElementById('scoreVal').textContent = score;
                            updateUpgradesHUD();
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }
            }

            // Colisiones Bala vs Jefe (aplicando daño progresivo)
            if (boss) {
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j] &&
                        bullets[j].x < boss.x + boss.width &&
                        bullets[j].x + bullets[j].width > boss.x &&
                        bullets[j].y < boss.y + boss.height &&
                        bullets[j].y + bullets[j].height > boss.y
                    ) {
                        boss.hp -= bullets[j].damage;
                        bullets.splice(j, 1);
                        if (boss.hp <= 0) {
                            score += 1500;
                            coins += 15;
                            document.getElementById('scoreVal').textContent = score;
                            updateUpgradesHUD();
                            boss = null;
                            break;
                        }
                    }
                }
            }
        }

        function updateLivesUI() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️ ';
            document.getElementById('livesVal').textContent = hearts.trim();
        }

        function drawPlayerShip(x, y) {
            ctx.save();
            ctx.translate(x, y);

            if (evolutionStage === 3) {
                ctx.fillStyle = '#f1f5f9';
                ctx.beginPath();
                ctx.ellipse(25, 26, 22, 18, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(15, 20, 8, 8);
                ctx.fillRect(30, 28, 6, 6);
            } else if (evolutionStage === 2) {
                ctx.fillStyle = '#a855f7';
                ctx.beginPath();
                ctx.ellipse(25, 26, 18, 22, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#c084fc';
                ctx.fillRect(20, -4, 10, 16);
            } else if (evolutionStage === 1) {
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.ellipse(25, 26, 20, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(25, 10, 10, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(16, 42, 6, 10);
                
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.ellipse(25, 26, 16, 20, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#cbd5e1';
                ctx.stroke();

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(25, 17, 9, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(21, 8); ctx.lineTo(29, 8); ctx.lineTo(25, 0);
                ctx.fill();

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(22, 2, 3.5, 0, Math.PI * 2);
                ctx.arc(27, 1, 4.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawEvilCorn(e) {
            ctx.save();
            ctx.translate(e.x, e.y);

            ctx.fillStyle = '#eab308';
            ctx.beginPath();
            ctx.roundRect(4, 6, 40, 42, [12, 12, 18, 18]);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#854d0e';
            ctx.stroke();

            // Si tienen más de 1 de vida (a partir de la vaca), se muestran con un casco de combate rojo distintivo
            if (e.maxHp > 1) {
                ctx.fillStyle = '#b91c1c';
                ctx.beginPath();
                ctx.arc(24, 10, 16, Math.PI, 0, false);
                ctx.fill();
            }

            ctx.fillStyle = '#dc2626';
            ctx.fillRect(11, 16, 9, 6);
            ctx.fillRect(28, 16, 9, 6);

            ctx.restore();
        }

        function drawBoss(b) {
            ctx.save();
            ctx.translate(b.x, b.y);

            ctx.fillStyle = '#ca8a04';
            ctx.beginPath();
            ctx.roundRect(0, 0, b.width, b.height, [20, 20, 30, 30]);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#713f12';
            ctx.stroke();

            ctx.fillStyle = '#991b1b';
            ctx.fillRect(30, 30, 20, 15);
            ctx.fillRect(70, 30, 20, 15);

            ctx.fillStyle = '#334155';
            ctx.fillRect(10, -15, b.width - 20, 8);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(10, -15, (b.width - 20) * (b.hp / b.maxHp), 8);

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            for (let s of stars) {
                ctx.fillRect(s.x, s.y, s.size, s.size);
            }

            if (boss) drawBoss(boss);

            drawPlayerShip(player.x, player.y);

            for (let b of bullets) {
                ctx.font = '22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let icon = '🐥';
                if (b.type === 'wool') icon = '🧶';
                if (b.type === 'horseshoe') icon = '🧲';
                if (b.type === 'milk') icon = '🥛';
                ctx.fillText(icon, b.x + b.width / 2, b.y + b.height / 2);
            }

            for (let bb of bossBullets) {
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🌽', bb.x + bb.width / 2, bb.y + bb.height / 2);
            }

            for (let e of enemies) {
                drawEvilCorn(e);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
