<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>🐔🚀 Gallina Cósmica</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03051c;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    top:10px;
    left:0;
    width:100%;

    display:flex;
    justify-content:space-between;

    padding:10px 15px;

    color:white;
    font-size:17px;
    font-weight:bold;

    text-shadow:
        0 2px 4px black,
        0 0 8px #00ffff;

    z-index:5;
}

#menu{
    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            rgba(40,70,180,.35),
            rgba(0,0,20,.95)
        );

    color:white;

    z-index:10;
}

#menu .chickenTitle{
    font-size:75px;

    animation:
        floatChicken 1.2s
        infinite alternate
        ease-in-out;
}

@keyframes floatChicken{

    from{
        transform:
            translateY(0)
            rotate(-4deg);
    }

    to{
        transform:
            translateY(-12px)
            rotate(4deg);
    }

}

#menu h1{
    font-size:clamp(32px,8vw,65px);

    margin-bottom:10px;

    text-shadow:
        0 0 10px #00ffff,
        0 0 25px #0088ff;
}

#menu p{
    max-width:500px;

    padding:0 20px;

    margin-bottom:25px;

    font-size:18px;
    line-height:1.5;
}

#start{

    border:none;

    border-radius:20px;

    padding:16px 35px;

    font-size:24px;

    font-weight:bold;

    background:#ffd83d;

    color:#402800;

    box-shadow:
        0 6px 0 #a87800,
        0 0 25px #ffe900;

    cursor:pointer;
}

#start:active{

    transform:translateY(5px);

    box-shadow:
        0 1px 0 #a87800;

}

#controls{

    position:fixed;

    bottom:20px;

    left:0;

    width:100%;

    display:flex;

    justify-content:center;

    gap:25px;

    z-index:5;
}

.control{

    width:75px;
    height:65px;

    border:none;

    border-radius:20px;

    background:
        rgba(255,255,255,.15);

    backdrop-filter:blur(5px);

    color:white;

    font-size:30px;

    font-weight:bold;

    border:
        2px solid
        rgba(255,255,255,.4);

    box-shadow:
        0 0 15px
        rgba(0,255,255,.3);
}

.control:active{

    transform:scale(.9);

    background:
        rgba(255,255,255,.35);

}

.hidden{
    display:none!important;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div>
        🐔 GALLINA CÓSMICA
    </div>

    <div>

        ⭐ <span id="score">0</span>

        &nbsp;

        ❤️ <span id="lives">3</span>

    </div>

</div>

<div id="menu">

    <div class="chickenTitle">
        🐔🚀
    </div>

    <h1>
        GALLINA CÓSMICA
    </h1>

    <p>
        ¡Los maíces invasores están
        atacando el espacio!
        <br><br>

        🌽 normales · ⚡ maíces rápidos
        · 👑 maíces gigantes
    </p>

    <button id="start">
        🚀 JUGAR
    </button>

</div>

<div id="controls"
     class="hidden">

    <button
        class="control"
        id="left">
        ◀
    </button>

    <button
        class="control"
        id="fire">
        🐣
    </button>

    <button
        class="control"
        id="right">
        ▶
    </button>

</div>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const scoreText =
    document.getElementById("score");

const livesText =
    document.getElementById("lives");

const menu =
    document.getElementById("menu");

const startButton =
    document.getElementById("start");

const controls =
    document.getElementById("controls");


let width;
let height;

let score = 0;
let lives = 3;

let gameRunning = false;

let lastTime = 0;

let enemyTimer = 0;

let keys = {};

let bullets = [];
let enemies = [];
let explosions = [];
let stars = [];


/* =========================
   RESOLUCIÓN
========================= */

function resize(){

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    if(chicken){

        chicken.y =
            height - 125;

    }

}

window.addEventListener(
    "resize",
    resize
);


/* =========================
   ESTRELLAS
========================= */

for(let i=0;i<120;i++){

    stars.push({

        x:Math.random(),

        y:Math.random(),

        size:
            Math.random()*2+.5,

        speed:
            Math.random()*.6+.1

    });

}


/* =========================
   GALLINA NAVE
========================= */

const chicken = {

    x:window.innerWidth/2,

    y:window.innerHeight-125,

    speed:430,

    size:70,

    wing:0,

    engine:0

};


/* =========================
   REINICIAR
========================= */

function resetGame(){

    score=0;

    lives=3;

    scoreText.textContent=score;

    livesText.textContent=lives;

    bullets=[];
    enemies=[];
    explosions=[];

    chicken.x =
        width/2;

    chicken.y =
        height-125;

}


/* =========================
   DISPARAR POLLITO
========================= */

function shoot(){

    if(!gameRunning)
        return;

    bullets.push({

        x:chicken.x,

        y:chicken.y-55,

        speed:650,

        size:18

    });

}


/* =========================
   CREAR MAÍZ
========================= */

function createEnemy(){

    let type="normal";

    const roll =
        Math.random();


    if(score >= 100){

        if(roll < .20){

            type="fast";

        }

    }


    if(score >= 250){

        if(roll < .12){

            type="giant";

        }

        else if(roll < .32){

            type="fast";

        }

    }


    let enemy;


    /* MAÍZ NORMAL */

    if(type==="normal"){

        enemy={

            type:"normal",

            x:
                30+
                Math.random()*
                (width-60),

            y:-50,

            size:43,

            speed:
                75+
                Math.random()*50,

            hp:1,

            points:10,

            wave:
                Math.random()*10

        };

    }


    /* MAÍZ RÁPIDO */

    else if(type==="fast"){

        enemy={

            type:"fast",

            x:
                30+
                Math.random()*
                (width-60),

            y:-50,

            size:35,

            speed:
                170+
                Math.random()*90,

            hp:1,

            points:20,

            wave:
                Math.random()*10

        };

    }


    /* MAÍZ GIGANTE */

    else{

        enemy={

            type:"giant",

            x:
                45+
                Math.random()*
                (width-90),

            y:-70,

            size:65,

            speed:
                50+
                Math.random()*35,

            hp:2,

            maxHp:2,

            points:30,

            wave:
                Math.random()*10

        };

    }


    enemies.push(enemy);

}


/* =========================
   EXPLOSIÓN
========================= */

function explode(x,y){

    for(let i=0;i<18;i++){

        explosions.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*
                280,

            vy:
                (Math.random()-.5)*
                280,

            life:1,

            size:
                Math.random()*7+3

        });

    }

}


/* =========================
   FONDO
========================= */

function drawStars(delta){

    ctx.fillStyle =
        "#02051b";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    for(const star of stars){

        star.y +=
            star.speed*
            delta;


        if(star.y>1){

            star.y=0;

        }


        ctx.fillStyle =
            "rgba(255,255,255,.8)";


        ctx.beginPath();

        ctx.arc(

            star.x*width,

            star.y*height,

            star.size,

            0,
            Math.PI*2

        );

        ctx.fill();

    }

}


/* =========================
   NUEVA GALLINA NAVE 🐔🚀
========================= */

function drawChicken(){

    chicken.wing += .15;

    chicken.engine += .25;


    const wingMove =
        Math.sin(
            chicken.wing
        )*4;


    const enginePower =
        15+
        Math.sin(
            chicken.engine
        )*7;


    ctx.save();


    ctx.translate(
        chicken.x,
        chicken.y
    );


    /*
       BRILLO GENERAL
    */

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        28;


    /*
       LLAMA DEL PROPULSOR
    */

    ctx.save();

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        25;

    ctx.fillStyle =
        "#00ffff";

    ctx.beginPath();

    ctx.moveTo(
        -16,
        38
    );

    ctx.lineTo(
        0,
        62+enginePower
    );

    ctx.lineTo(
        16,
        38
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#fff45c";

    ctx.beginPath();

    ctx.moveTo(
        -8,
        39
    );

    ctx.lineTo(
        0,
        52+enginePower*.6
    );

    ctx.lineTo(
        8,
        39
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();


    /*
       CUERPO DE NAVE
    */

    ctx.fillStyle =
        "#f4f4f4";

    ctx.beginPath();

    ctx.ellipse(
        0,
        5,
        31,
        38,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       PARTE INFERIOR METÁLICA
    */

    ctx.fillStyle =
        "#b9c7d6";

    ctx.beginPath();

    ctx.ellipse(
        0,
        22,
        25,
        18,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       CABEZA
    */

    ctx.fillStyle =
        "#ffffff";

    ctx.beginPath();

    ctx.arc(
        0,
        -28,
        25,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       CRESTA
    */

    ctx.fillStyle =
        "#ff3b3b";

    ctx.beginPath();

    ctx.arc(
        -13,
        -50,
        9,
        0,
        Math.PI*2
    );

    ctx.arc(
        0,
        -54,
        11,
        0,
        Math.PI*2
    );

    ctx.arc(
        13,
        -50,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       CABINA / VISOR
    */

    ctx.shadowColor =
        "#008cff";

    ctx.shadowBlur =
        12;

    ctx.fillStyle =
        "#56e8ff";

    ctx.beginPath();

    ctx.ellipse(
        0,
        -31,
        15,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    /*
       OJO
    */

    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        9,
        -34,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       PICO
    */

    ctx.fillStyle =
        "#ffb52e";

    ctx.beginPath();

    ctx.moveTo(
        20,
        -27
    );

    ctx.lineTo(
        39,
        -19
    );

    ctx.lineTo(
        20,
        -12
    );

    ctx.closePath();

    ctx.fill();


    /*
       ALA IZQUIERDA
    */

    ctx.fillStyle =
        "#dfe7ef";

    ctx.beginPath();

    ctx.ellipse(
        -32,
        7+wingMove,
        13,
        27,
        -.45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       ALA DERECHA
    */

    ctx.beginPath();

    ctx.ellipse(
        32,
        7-wingMove,
        13,
        27,
        .45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       PEQUEÑAS LUCES DE LA NAVE
    */

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        12;

    ctx.fillStyle =
        "#00ffff";

    ctx.beginPath();

    ctx.arc(
        -22,
        20,
        3,
        0,
        Math.PI*2
    );

    ctx.arc(
        22,
        20,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================
   POLLITO
========================= */

function drawBullet(bullet){

    ctx.save();

    ctx.translate(
        bullet.x,
        bullet.y
    );

    ctx.shadowColor =
        "#ffe600";

    ctx.shadowBlur =
        15;

    ctx.font =
        "24px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "🐣",
        0,
        0
    );

    ctx.restore();

}


/* =========================
   MAÍCES
========================= */

function drawEnemy(enemy){

    ctx.save();

    ctx.translate(
        enemy.x,
        enemy.y
    );


    if(enemy.type==="normal"){

        enemy.wave += .035;

    }


    if(enemy.type==="fast"){

        enemy.wave += .09;

    }


    if(enemy.type==="giant"){

        enemy.wave += .025;

    }


    const wobble =
        Math.sin(
            enemy.wave
        );


    ctx.rotate(
        wobble*.18
    );


    ctx.shadowColor =
        enemy.type==="fast"
        ? "#00ffff"
        : enemy.type==="giant"
        ? "#ff5500"
        : "#ffe000";


    ctx.shadowBlur =
        18;


    ctx.font =
        enemy.size+
        "px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    if(enemy.type==="normal"){

        ctx.fillText(
            "🌽",
            0,
            0
        );

    }

    else if(enemy.type==="fast"){

        ctx.fillText(
            "⚡🌽",
            0,
            0
        );

    }

    else{

        ctx.fillText(
            "👑🌽",
            0,
            0
        );

    }


    /*
       VIDA DEL GIGANTE
    */

    if(enemy.type==="giant"){

        const barWidth =
            65;

        ctx.fillStyle =
            "rgba(0,0,0,.7)";

        ctx.fillRect(
            -barWidth/2,
            -45,
            barWidth,
            7
        );

        ctx.fillStyle =
            "#ff4444";

        ctx.fillRect(
            -barWidth/2,
            -45,
            barWidth*
            (enemy.hp/
             enemy.maxHp),
            7
        );

    }


    ctx.restore();

}


/* =========================
   ACTUALIZAR
========================= */

function update(delta){

    /*
       MOVIMIENTO
    */

    if(keys.left){

        chicken.x -=
            chicken.speed*
            delta;

    }


    if(keys.right){

        chicken.x +=
            chicken.speed*
            delta;

    }


    chicken.x =
        Math.max(
            40,
            Math.min(
                width-40,
                chicken.x
            )
        );


    /*
       POLLITOS
    */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];


        bullet.y -=
            bullet.speed*
            delta;


        if(
            bullet.y < -50
        ){

            bullets.splice(
                i,
                1
            );

        }

    }


    /*
       MAÍCES
    */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy =
            enemies[i];


        if(
            enemy.type==="fast"
        ){

            enemy.x +=
                Math.sin(
                    enemy.wave
                )*
                90*
                delta;

        }

        else if(
            enemy.type==="giant"
        ){

            enemy.x +=
                Math.sin(
                    enemy.wave
                )*
                25*
                delta;

        }
