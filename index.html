<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gallina vs Maíces Malvados</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 640px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.7);
            overflow: hidden;
            border-radius: 16px;
            border: 2px solid #334155;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            pointer-events: none;
        }

        .header-score {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            pointer-events: auto;
            z-index: 10;
        }

        .screen-overlay h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .screen-overlay p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .controls-hint {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="header-score">
                <div>Puntos: <span id="scoreVal">0</span></div>
                <div>Vidas: <span id="livesVal">❤️ ❤️ ❤️</span></div>
            </div>
        </div>

        <!-- Pantalla de Inicio -->
        <div id="startScreen" class="screen-overlay">
            <h1>🐔 Gallina vs Maíces</h1>
            <p>¡Lanza pollitos valientes para detener a las mazorcas malvadas antes de que invadan el corral!</p>
            <button class="btn" id="startBtn">¡A Pelear!</button>
        </div>

        <!-- Pantalla de Game Over -->
        <div id="gameOverScreen" class="screen-overlay" style="display: none;">
            <h1>¡Derrota!</h1>
            <p>Los maíces se apoderaron del terreno.<br>Puntuación final: <strong id="finalScore">0</strong></p>
            <button class="btn" id="restartBtn">Jugar de Nuevo</button>
        </div>

        <div class="controls-hint">Arrastra la gallina o usa las flechas / A-D</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Ajustar resolución interna del canvas para nitidez
        canvas.width = 420;
        canvas.height = 640;

        let score = 0;
        let lives = 3;
        let gameState = 'START'; // START, PLAYING, GAMEOVER

        // Entidad Gallina (Jugador)
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 80,
            width: 50,
            height: 50,
            speed: 6,
            dx: 0
        };

        let bullets = []; // Pollitos disparados
        let enemies = []; // Maíces malvados
        let particles = []; // Plumas o efectos de explosión

        // Control de teclado
        let keys = { ArrowLeft: false, ArrowRight: false, KeyA: false, KeyD: false, Space: false };

        window.addEventListener('keydown', (e) => {
            if (e.code in keys) keys[e.code] = true;
            if (e.code === 'Space' && gameState === 'PLAYING') shootBullet();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code in keys) keys[e.code] = false;
        });

        // Control táctil / Mouse arrastrando
        let isDragging = false;
        canvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            movePlayerToTouch(e);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (isDragging) movePlayerToTouch(e);
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        function movePlayerToTouch(e) {
            const rect = canvas.getBoundingClientRect();
            const touchX = (e.clientX - rect.left) * (canvas.width / rect.width);
            player.x = touchX - player.width / 2;
        }

        function shootBullet() {
            // Disparar un pollito desde el centro de la gallina
            bullets.push({
                x: player.x + player.width / 2 - 10,
                y: player.y,
                width: 20,
                height: 20,
                speed: 8
            });
        }

        let shootTimer = 0;
        function spawnEnemy() {
            const size = 44;
            const x = Math.random() * (canvas.width - size - 20) + 10;
            enemies.push({
                x: x,
                y: -50,
                width: size,
                height: size,
                speed: 1.5 + Math.random() * 1.5
            });
        }

        // Interfaz y botones
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        function startGame() {
            score = 0;
            lives = 3;
            bullets = [];
            enemies = [];
            particles = [];
            player.x = canvas.width / 2 - player.width / 2;
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('livesVal').textContent = '❤️ ❤️ ❤️';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            gameState = 'PLAYING';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        // Bucle principal del juego
        let enemySpawnInterval = 0;
        function update() {
            if (gameState !== 'PLAYING') return;

            // Movimiento de la gallina por teclado
            if (keys.ArrowLeft || keys.KeyA) player.x -= player.speed;
            if (keys.ArrowRight || keys.KeyD) player.x += player.speed;

            // Limites de pantalla
            if (player.x < 10) player.x = 10;
            if (player.x > canvas.width - player.width - 10) player.x = canvas.width - player.width - 10;

            // Disparo automático rítmico cada cierto tiempo para facilitar móvil/PC
            shootTimer++;
            if (shootTimer % 25 === 0) {
                shootBullet();
            }

            // Actualizar pollitos (proyectiles)
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < -20) {
                    bullets.splice(i, 1);
                }
            }

            // Generar maíces enemigos
            enemySpawnInterval++;
            if (enemySpawnInterval > 50) {
                spawnEnemy();
                enemySpawnInterval = 0;
            }

            // Actualizar maíces malvados
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                // Si el maíz toca fondo (pasa a la gallina)
                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) {
                        gameOver();
                    }
                    continue;
                }

                // Colisión Gallina vs Maíz enemigo
                if (
                    player.x < enemies[i].x + enemies[i].width &&
                    player.x + player.width > enemies[i].x &&
                    player.y < enemies[i].y + enemies[i].height &&
                    player.y + player.height > enemies[i].y
                ) {
                    enemies.splice(i, 1);
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) {
                        gameOver();
                    }
                    continue;
                }

                // Colisión Pollito vs Maíz enemigo
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j] &&
                        bullets[j].x < enemies[i].x + enemies[i].width &&
                        bullets[j].x + bullets[j].width > enemies[i].x &&
                        bullets[j].y < enemies[i].y + enemies[i].height &&
                        bullets[j].y + bullets[j].height > enemies[i].y
                    ) {
                        // Impacto!
                        score += 100;
                        document.getElementById('scoreVal').textContent = score;
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }
            }
        }

        function updateLivesUI() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️ ';
            document.getElementById('livesVal').textContent = hearts.trim();
        }

        function draw() {
            // Limpiar pantalla
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar estrellas o fondo ambiental sutil
            ctx.fillStyle = '#ffffff15';
            ctx.fillRect(50, 100, 2, 2);
            ctx.fillRect(150, 250, 3, 3);
            ctx.fillRect(320, 80, 2, 2);
            ctx.fillRect(280, 400, 3, 3);

            // Dibujar Jugador (Gallina tierna)
            ctx.font = '40px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐔', player.x + player.width / 2, player.y + player.height / 2);

            // Dibujar Proyectiles (Pollitos voladores)
            for (let b of bullets) {
                ctx.font = '22px sans-serif';
                ctx.fillText('🐥', b.x + b.width / 2, b.y + b.height / 2);
            }

            // Dibujar Enemigos (Maíces malvados)
            for (let e of enemies) {
                ctx.font = '36px sans-serif';
                ctx.fillText('🌽', e.x + e.width / 2, e.y + e.height / 2);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
