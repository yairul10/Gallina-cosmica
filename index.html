<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🐔🚀 Gallina Cósmica</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#03051c;
font-family:Arial,sans-serif;
touch-action:none;
}

canvas{
display:block;
width:100%;
height:100%;
}

#hud{
position:fixed;
top:8px;
left:0;
width:100%;
display:flex;
justify-content:space-between;
padding:10px 15px;
color:white;
font-size:16px;
font-weight:bold;
text-shadow:0 2px 4px black,0 0 8px #00ffff;
z-index:5;
}

#menu{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
background:radial-gradient(circle,rgba(40,70,180,.4),rgba(0,0,20,.97));
color:white;
z-index:10;
padding:20px;
}

#menu .chickenTitle{
font-size:70px;
animation:floatChicken 1.2s infinite alternate ease-in-out;
}

@keyframes floatChicken{
from{transform:translateY(0) rotate(-4deg)}
to{transform:translateY(-12px) rotate(4deg)}
}

#menu h1{
font-size:clamp(30px,8vw,60px);
margin-bottom:8px;
text-shadow:0 0 10px #00ffff,0 0 25px #0088ff;
}

#menu p{
max-width:500px;
margin-bottom:18px;
font-size:17px;
line-height:1.45;
}

button{
font-family:Arial,sans-serif;
cursor:pointer;
}

#start{
border:none;
border-radius:20px;
padding:15px 32px;
font-size:23px;
font-weight:bold;
background:#ffd83d;
color:#402800;
box-shadow:0 6px 0 #a87800,0 0 25px #ffe900;
}

#start:active{
transform:translateY(5px);
box-shadow:0 1px 0 #a87800;
}

#shop{
display:none;
margin-top:15px;
width:min(420px,95vw);
background:rgba(0,0,0,.55);
border:2px solid rgba(0,255,255,.4);
border-radius:18px;
padding:14px;
}

.shopTitle{
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

.coins{
font-size:19px;
margin-bottom:10px;
}

.upgrade{
width:100%;
margin:5px 0;
padding:11px;
border:1px solid rgba(255,255,255,.25);
border-radius:12px;
background:rgba(255,255,255,.1);
color:white;
font-size:15px;
text-align:left;
}

.upgrade:active{
transform:scale(.98);
}

#controls{
position:fixed;
bottom:18px;
left:0;
width:100%;
display:flex;
justify-content:center;
gap:20px;
z-index:5;
}

.control{
width:75px;
height:65px;
border:none;
border-radius:20px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(5px);
color:white;
font-size:30px;
font-weight:bold;
border:2px solid rgba(255,255,255,.4);
box-shadow:0 0 15px rgba(0,255,255,.3);
}

.control:active{
transform:scale(.9);
background:rgba(255,255,255,.35);
}

.hidden{
display:none!important;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

<div>🐔 GALLINA CÓSMICA</div>

<div>
⭐ <span id="score">0</span>
&nbsp;
🪙 <span id="coins">0</span>
&nbsp;
❤️ <span id="lives">3</span>
</div>

</div>

<div id="menu">

<div class="chickenTitle">🐔🚀</div>

<h1 id="title">
GALLINA CÓSMICA
</h1>

<p id="message">
¡Los maíces invasores están atacando el espacio!
<br><br>
🌽 normales · ⚡ maíces rápidos · 👑 maíces gigantes
</p>

<button id="start">
🚀 JUGAR
</button>

<div id="shop">

<div class="shopTitle">
🛒 TALLER DE LA GALLINA
</div>

<div class="coins">
🪙 Monedas:
<strong id="shopCoins">0</strong>
</div>

<button class="upgrade" id="upgradeFire"></button>

<button class="upgrade" id="upgradeSpeed"></button>

<button class="upgrade" id="upgradeShield"></button>

<button class="upgrade" id="upgradeLife"></button>

</div>

</div>

<div id="controls" class="hidden">

<button class="control" id="left">◀</button>

<button class="control" id="fire">🐣</button>

<button class="control" id="right">▶</button>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreText=document.getElementById("score");
const livesText=document.getElementById("lives");
const coinsText=document.getElementById("coins");

const menu=document.getElementById("menu");
const startButton=document.getElementById("start");

const title=document.getElementById("title");
const message=document.getElementById("message");

const shop=document.getElementById("shop");
const shopCoins=document.getElementById("shopCoins");

const upgradeFire=document.getElementById("upgradeFire");
const upgradeSpeed=document.getElementById("upgradeSpeed");
const upgradeShield=document.getElementById("upgradeShield");
const upgradeLife=document.getElementById("upgradeLife");

const controls=document.getElementById("controls");


let width=window.innerWidth;
let height=window.innerHeight;

let score=0;
let lives=3;

let gameRunning=false;

let lastTime=0;
let enemyTimer=0;
let bossTimer=0;

let keys={};

let bullets=[];
let enemies=[];
let explosions=[];
let stars=[];


/* =========================
   MEJORAS
========================= */

let coins=
Number(localStorage.getItem("galacticaCoins"))||0;

let upgrades={

fire:
Number(localStorage.getItem("galacticaFire"))||0,

speed:
Number(localStorage.getItem("galacticaSpeed"))||0,

shield:
Number(localStorage.getItem("galacticaShield"))||0,

life:
Number(localStorage.getItem("galacticaLife"))||0

};


function saveProgress(){

localStorage.setItem(
"galacticaCoins",
coins
);

localStorage.setItem(
"galacticaFire",
upgrades.fire
);

localStorage.setItem(
"galacticaSpeed",
upgrades.speed
);

localStorage.setItem(
"galacticaShield",
upgrades.shield
);

localStorage.setItem(
"galacticaLife",
upgrades.life
);

}


/* =========================
   TIENDA
========================= */

function fireCost(){

return 40+
upgrades.fire*35;

}

function speedCost(){

return 50+
upgrades.speed*40;

}

function shieldCost(){

return 80+
upgrades.shield*60;

}

function lifeCost(){

return 100+
upgrades.life*80;

}


function updateShop(){

shopCoins.textContent=coins;


upgradeFire.textContent=
"🐣 Mejorar disparo "+
"— Nivel "+upgrades.fire+
" — 🪙 "+fireCost();


upgradeSpeed.textContent=
"🚀 Mejorar velocidad "+
"— Nivel "+upgrades.speed+
" — 🪙 "+speedCost();


upgradeShield.textContent=
"🛡️ Mejorar escudo "+
"— Nivel "+upgrades.shield+
" — 🪙 "+shieldCost();


upgradeLife.textContent=
"❤️ Vida extra "+
"— Nivel "+upgrades.life+
" — 🪙 "+lifeCost();

}


upgradeFire.onclick=function(){

const cost=fireCost();

if(coins>=cost){

coins-=cost;

upgrades.fire++;

saveProgress();

updateShop();

}

};


upgradeSpeed.onclick=function(){

const cost=speedCost();

if(coins>=cost){

coins-=cost;

upgrades.speed++;

saveProgress();

updateShop();

}

};


upgradeShield.onclick=function(){

const cost=shieldCost();

if(coins>=cost){

coins-=cost;

upgrades.shield++;

saveProgress();

updateShop();

}

};


upgradeLife.onclick=function(){

const cost=lifeCost();

if(coins>=cost){

coins-=cost;

upgrades.life++;

saveProgress();

updateShop();

}

};


/* =========================
   RESOLUCIÓN
========================= */

function resize(){

width=window.innerWidth;
height=window.innerHeight;

const dpr=
Math.min(
window.devicePixelRatio||1,
2
);

canvas.width=width*dpr;
canvas.height=height*dpr;

ctx.setTransform(
dpr,0,0,dpr,0,0
);

if(chicken){

chicken.y=height-125;

}

}

window.addEventListener(
"resize",
resize
);


/* =========================
   ESTRELLAS
========================= */

for(let i=0;i<120;i++){

stars.push({

x:Math.random(),
y:Math.random(),
size:Math.random()*2+.5,
speed:Math.random()*.6+.1

});

}


/* =========================
   GALLINA
========================= */

const chicken={

x:width/2,
y:height-125,

speed:430,
size:70,

wing:0,
engine:0

};


/* =========================
   REINICIAR
========================= */

function resetGame(){

score=0;

lives=
3+
upgrades.life;

scoreText.textContent=score;
livesText.textContent=lives;

coinsText.textContent=coins;

bullets=[];
enemies=[];
explosions=[];

chicken.x=width/2;
chicken.y=height-125;

bossTimer=0;

}


/* =========================
   DISPARAR
========================= */

function shoot(){

if(!gameRunning)
return;


const amount=
1+
Math.min(
upgrades.fire,
3
);


for(let i=0;i<amount;i++){

let offset=
(i-(amount-1)/2)*18;

bullets.push({

x:chicken.x+offset,
y:chicken.y-55,
speed:650,
size:18

});

}

}


/* =========================
   CREAR ENEMIGO
========================= */

function createEnemy(){

let type="normal";

const roll=Math.random();


if(score>=100){

if(roll<.20)
type="fast";

}


if(score>=250){

if(roll<.12){

type="giant";

}

else if(roll<.32){

type="fast";

}

}


let enemy;


if(type==="normal"){

enemy={

type:"normal",

x:
30+
Math.random()*
(width-60),

y:-50,

size:43,

speed:
75+
Math.random()*50,

hp:1,

points:10,

coins:2,

wave:
Math.random()*10

};

}


else if(type==="fast"){

enemy={

type:"fast",

x:
30+
Math.random()*
(width-60),

y:-50,

size:35,

speed:
170+
Math.random()*90,

hp:1,

points:20,

coins:4,

wave:
Math.random()*10

};

}


else{

enemy={

type:"giant",

x:
45+
Math.random()*
(width-90),

y:-70,

size:65,

speed:
50+
Math.random()*35,

hp:2,

maxHp:2,

points:30,

coins:7,

wave:
Math.random()*10

};

}

enemies.push(enemy);

}


/* =========================
   JEFE
========================= */

function createBoss(){

enemies.push({

type:"boss",

x:width/2,

y:-100,

size:105,

speed:35,

hp:12,

maxHp:12,

points:250,

coins:50,

wave:0

});

}


/* =========================
   EXPLOSIÓN
========================= */

function explode(x,y){

for(let i=0;i<20;i++){

explosions.push({

x:x,
y:y,

vx:
(Math.random()-.5)*280,

vy:
(Math.random()-.5)*280,

life:1,

size:
Math.random()*7+3

});

}

}


/* =========================
   FONDO
========================= */

function drawStars(delta){

ctx.fillStyle="#02051b";

ctx.fillRect(
0,0,width,height
);


for(const star of stars){

star.y+=star.speed*delta;

if(star.y>1)
star.y=0;


ctx.fillStyle=
"rgba(255,255,255,.8)";

ctx.beginPath();

ctx.arc(
star.x*width,
star.y*height,
star.size,
0,
Math.PI*2
);

ctx.fill();

}

}


/* =========================
   GALLINA
========================= */

function drawChicken(){

chicken.wing+=.15;
chicken.engine+=.25;


const wingMove=
Math.sin(chicken.wing)*4;

const enginePower=
15+
Math.sin(chicken.engine)*7;


ctx.save();

ctx.translate(
chicken.x,
chicken.y
);
