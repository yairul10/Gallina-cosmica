<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Nave Gallina vs Maíces Malvados</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #020617;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 640px;
            background: #0f172a;
            box-shadow: 0 25px 35px -5px rgb(0 0 0 / 0.9);
            overflow: hidden;
            border-radius: 20px;
            border: 3px solid #334155;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #090d16;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            pointer-events: none;
        }

        .header-score {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .controls-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
            margin-bottom: 5px;
        }

        .upgrades-panel {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 200px;
        }

        .upgrade-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 4px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s;
        }

        .upgrade-btn:hover:not(:disabled) {
            background: #334155;
        }

        .upgrade-btn:disabled {
            border-color: #64748b;
            color: #64748b;
            cursor: default;
        }

        .fire-button-container {
            pointer-events: auto;
        }

        .btn-fire {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border: 3px solid #fee2e2;
            border-radius: 50%;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.5);
            transition: transform 0.08s;
        }

        .btn-fire:active {
            transform: scale(0.9);
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            pointer-events: auto;
            z-index: 10;
        }

        .screen-overlay h1 {
            font-size: 1.6rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .screen-overlay p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .leaderboard-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 10px;
            padding: 8px 16px;
            margin-bottom: 14px;
            width: 100%;
            max-width: 260px;
            text-align: left;
        }

        .leaderboard-box h3 {
            font-size: 0.9rem;
            color: #fbbf24;
            margin-bottom: 4px;
            text-align: center;
        }

        .lb-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #cbd5e1;
            padding: 2px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }

        .initials-input-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
            align-items: center;
        }

        .initials-input-container input {
            background: #1e293b;
            border: 2px solid #38bdf8;
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
            width: 60px;
            padding: 6px;
            border-radius: 8px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

<div id="game-container">

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">

        <div class="header-score">
            <div>
                Pts: <span id="scoreVal">0</span> |
                🪙 <span id="coinVal">0</span>
            </div>

            <div>
                Vidas: <span id="livesVal">❤️ ❤️ ❤️</span>
            </div>
        </div>

        <div class="controls-hud">

            <div class="upgrades-panel" id="upgradesPanel">

                <button class="upgrade-btn"
                        id="upgBullets"
                        onclick="buyUpgrade('bullets')">
                    Daño/Disparo (Lv.0)
                </button>

                <button class="upgrade-btn"
                        id="upgSpeed"
                        onclick="buyUpgrade('speed')">
                    Velocidad (Lv.1)
                </button>

                <button class="upgrade-btn"
                        id="upgLife"
                        onclick="buyUpgrade('life')">
                    +1 Vida [🪙15]
                </button>

                <button class="upgrade-btn"
                        id="upgEvolve"
                        onclick="buyUpgrade('evolve')"
                        style="display:none; border-color:#fbbf24; color:#fbbf24;">
                    🌟 Evolucionar
                </button>

            </div>

            <div class="fire-button-container">

                <button class="btn-fire" id="fireBtn">
                    🚀
                </button>

            </div>

        </div>

    </div>


    <div id="startScreen" class="screen-overlay">

        <h1>🐔 Granja Espacial Épica</h1>

        <p>
            Mejoras a 10 y 15 monedas.
            ¡Evoluciona hasta la Vaca lechera y compite por entrar al Top 5 de récords!
        </p>

        <div class="leaderboard-box">

            <h3>🏆 Mejores Récords</h3>

            <div id="startLeaderboardList"></div>

        </div>

        <button class="btn" id="startBtn">
            ¡Despegar!
        </button>

    </div>


    <div id="gameOverScreen"
         class="screen-overlay"
         style="display: none;">

        <h1>¡Nave Destruida!</h1>

        <p>
            Puntuación final:
            <strong id="finalScore">0</strong>
        </p>

        <div id="saveScoreSection">

            <p style="font-size:0.8rem; margin-bottom:4px;">
                ¡Nuevo Récord! Ingresa tus 3 iniciales:
            </p>

            <div class="initials-input-container">

                <input type="text"
                       id="playerInitials"
                       maxlength="3"
                       value="AAA">

                <button class="btn"
                        id="saveScoreBtn"
                        style="padding: 8px 14px; font-size: 0.85rem;">
                    Guardar
                </button>

            </div>

        </div>

        <div class="leaderboard-box">

            <h3>🏆 Top Puntajes</h3>

            <div id="endLeaderboardList"></div>

        </div>

        <button class="btn"
                id="restartBtn"
                style="margin-top: 4px;">
            Reintentar
        </button>

    </div>

</div>


<script>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 420;
canvas.height = 640;


/* =========================================================
   VARIABLES DEL JUEGO
========================================================= */

let score = 0;
let coins = 0;
let lives = 3;
let gameTime = 0;
let gameState = 'START';

let evolutionStage = 0;
let maxUpgradeLimit = 3;
let nextBossScoreThreshold = 5000;

let upgrades = {
    bullets: 0,
    speed: 1
};


const player = {

    x: canvas.width / 2 - 25,
    y: canvas.height - 110,

    width: 50,
    height: 50,

    baseSpeed: 5.5

};


let bullets = [];
let enemies = [];
let bossBullets = [];
let boss = null;
let stars = [];


/* =========================================================
   RÉCORDS
========================================================= */

let leaderboard =
    JSON.parse(localStorage.getItem('farm_space_leaderboard')) ||
    [
        { name: 'PRO', score: 5000 },
        { name: 'ANA', score: 3000 },
        { name: 'BOB', score: 1500 }
    ];


function saveLeaderboard() {

    localStorage.setItem(
        'farm_space_leaderboard',
        JSON.stringify(leaderboard)
    );

}


function renderLeaderboard(elementId) {

    const container =
        document.getElementById(elementId);

    container.innerHTML = '';

    if (leaderboard.length === 0) {

        container.innerHTML =
            '<div class="lb-row"><span>Sin récords aún</span><span></span></div>';

        return;
    }

    leaderboard.forEach((item, index) => {

        const row =
            document.createElement('div');

        row.className = 'lb-row';

        row.innerHTML =
            `<span>#${index + 1} ${item.name}</span>
             <span>${item.score} pts</span>`;

        container.appendChild(row);

    });

}


/* =========================================================
   ESTRELLAS
========================================================= */

for (let i = 0; i < 55; i++) {

    stars.push({

        x: Math.random() * canvas.width,

        y: Math.random() * canvas.height,

        size: Math.random() * 2 + 0.5,

        speed: Math.random() * 0.8 + 0.2,

        alpha: Math.random() * 0.7 + 0.3

    });

}


/* =========================================================
   CONTROLES
========================================================= */

let keys = {

    ArrowLeft: false,
    ArrowRight: false,
    KeyA: false,
    KeyD: false

};


window.addEventListener('keydown', (e) => {

    if (e.code in keys) {

        keys[e.code] = true;

    }

    if (e.code === 'Space' &&
        gameState === 'PLAYING') {

        shootBullet();

        e.preventDefault();

    }

});


window.addEventListener('keyup', (e) => {

    if (e.code in keys) {

        keys[e.code] = false;

    }

});


let isDragging = false;


canvas.addEventListener('pointerdown', (e) => {

    isDragging = true;

    movePlayerToTouch(e);

});


canvas.addEventListener('pointermove', (e) => {

    if (isDragging) {

        movePlayerToTouch(e);

    }

});


window.addEventListener('pointerup', () => {

    isDragging = false;

});


function movePlayerToTouch(e) {

    const rect =
        canvas.getBoundingClientRect();

    const touchX =
        (e.clientX - rect.left) *
        (canvas.width / rect.width);

    player.x =
        touchX - player.width / 2;

}


/* =========================================================
   BOTÓN DISPARO
========================================================= */

document
    .getElementById('fireBtn')
    .addEventListener('click', (e) => {

        e.stopPropagation();

        if (gameState === 'PLAYING') {

            shootBullet();

        }

    });


/* =========================================================
   DISPAROS
========================================================= */

function shootBullet() {

    let bulletSpeed = 10;

    let widthSize = 16;
    let heightSize = 16;

    let bType = 'chick';

    if (evolutionStage === 1)
        bType = 'wool';

    if (evolutionStage === 2)
        bType = 'horseshoe';

    if (evolutionStage === 3)
        bType = 'milk';


    let bulletDamage =
        upgrades.bullets === 0
            ? 1
            : upgrades.bullets;


    if (upgrades.bullets >= 2) {

        bullets.push({
            x: player.x + 4,
            y: player.y - 10,
            width: widthSize,
            height: heightSize,
            speed: bulletSpeed,
            dx: -1.2,
            type: bType,
            damage: bulletDamage
        });

        bullets.push({
            x: player.x + player.width / 2 - 8,
            y: player.y - 14,
            width: widthSize,
            height: heightSize,
            speed: bulletSpeed,
            dx: 0,
            type: bType,
            damage: bulletDamage
        });

        bullets.push({
            x: player.x + player.width - 20,
            y: player.y - 10,
            width: widthSize,
            height: heightSize,
            speed: bulletSpeed,
            dx: 1.2,
            type: bType,
            damage: bulletDamage
        });

    }

    else if (upgrades.bullets === 1) {

        bullets.push({
            x: player.x + 8,
            y: player.y - 10,
            width: widthSize,
            height: heightSize,
            speed: bulletSpeed,
            dx: 0,
            type: bType,
            damage: bulletDamage
        });

        bullets.push({
            x: player.x + player.width - 24,
            y: player.y - 10,
            width: widthSize,
            height: heightSize,
            speed: bulletSpeed,
            dx: 0,
            type: bType,
            damage: bulletDamage
        });

    }

    else {

        bullets.push({

            x: player.x + player.width / 2 - 8,

            y: player.y - 10,

            width: widthSize,

            height: heightSize,

            speed: bulletSpeed,

            dx: 0,

            type: bType,

            damage: bulletDamage

        });

    }

}


/* =========================================================
   MEJORAS
========================================================= */

window.buyUpgrade = function(type) {

    if (
        type === 'bullets' &&
        upgrades.bullets < maxUpgradeLimit &&
        coins >= 10
    ) {

        coins -= 10;

        upgrades.bullets++;

    }

    else if (
        type === 'speed' &&
        upgrades.speed < maxUpgradeLimit &&
        coins >= 10
    ) {

        coins -= 10;

        upgrades.speed++;

    }

    else if (
        type === 'life' &&
        coins >= 15
    ) {

        coins -= 15;

        lives++;

        updateLivesUI();

    }

    else if (type === 'evolve') {

        if (evolutionStage === 0) {

            evolutionStage = 1;

            maxUpgradeLimit = 6;

        }

        else if (evolutionStage === 1) {

            evolutionStage = 2;

            maxUpgradeLimit = 10;

        }

        else if (evolutionStage === 2) {

            evolutionStage = 3;

            maxUpgradeLimit = 10;

        }

        document
            .getElementById('upgEvolve')
            .style.display = 'none';

    }

    updateUpgradesHUD();

};


function updateUpgradesHUD() {

    document
        .getElementById('coinVal')
        .textContent = coins;


    document
        .getElementById('upgBullets')
        .textContent =
            upgrades.bullets >= maxUpgradeLimit
            ? 'Daño Disparos: MÁX'
            : `Daño/Disparos [🪙10] (Lv.${upgrades.bullets})`;


    document
        .getElementById('upgSpeed')
        .textContent =
            upgrades.speed >= maxUpgradeLimit
            ? 'Velocidad: MÁX'
            : `Velocidad [🪙10] (Lv.${upgrades.speed})`;


    document
        .getElementById('upgLife')
        .textContent =
            '+1 Vida [🪙15]';


    let evolveBtn =
        document.getElementById('upgEvolve');


    if (
        upgrades.bullets >= maxUpgradeLimit &&
        upgrades.speed >= maxUpgradeLimit
    ) {

        if (evolutionStage === 0) {

            evolveBtn.style.display = 'block';

            evolveBtn.textContent =
                '🌟 Evolucionar a Oveja';

        }

        else if (evolutionStage === 1) {

            evolveBtn.style.display = 'block';

            evolveBtn.textContent =
                '🌟 Evolucionar a Caballo';

        }

        else if (evolutionStage === 2) {

            evolveBtn.style.display = 'block';

            evolveBtn.textContent =
                '🌟 Evolucionar a Vaca';

        }

        else {

            evolveBtn.style.display = 'none';

        }

    }

    else {

        evolveBtn.style.display = 'none';

    }

}


/* =========================================================
   ENEMIGOS
========================================================= */

function spawnEnemy() {

    if (boss) return;

    const size = 48;

    const x =
        Math.random() *
        (canvas.width - size - 20) +
        10;

    let speedMultiplier =
        1 + (gameTime / 30);

    let baseCornHp =
        evolutionStage >= 3
        ? 3
        : 1;


    enemies.push({

        x: x,

        y: -60,

        width: size,

        height: size,

        hp: baseCornHp,

        maxHp: baseCornHp,

        speed:
            (1.5 + Math.random() * 1.5) *
            speedMultiplier,

        wobble:
            Math.random() * Math.PI

    });

}


/* =========================================================
   JEFE
========================================================= */

function spawnBoss() {

    let bossLevel =
        Math.floor(score / 5000);

    let bossHp =
        60 + (bossLevel * 45);


    boss = {

        x:
            canvas.width / 2 - 60,

        y: -100,

        width: 120,

        height: 100,

        maxHp: bossHp,

        hp: bossHp,

        speed:
            1.5 + (bossLevel * 0.1),

        direction: 1,

        shootCooldown: 0

    };

}


/* =========================================================
   BOTONES
========================================================= */

document
    .getElementById('startBtn')
    .addEventListener('click', startGame);


document
    .getElementById('restartBtn')
    .addEventListener('click', startGame);


document
    .getElementById('saveScoreBtn')
    .addEventListener('click', () => {

        let initials =
            document
                .getElementById('playerInitials')
                .value
                .toUpperCase()
                .slice(0, 3);


        if (!initials)
            initials = 'ABC';


        leaderboard.push({

            name: initials,

            score: score

        });


        leaderboard.sort(
            (a, b) => b.score - a.score
        );


        if (leaderboard.length > 5) {

            leaderboard =
                leaderboard.slice(0, 5);

        }


        saveLeaderboard();


        document
            .getElementById('saveScoreSection')
            .style.display = 'none';


        renderLeaderboard(
            'endLeaderboardList'
        );

    });


/* =========================================================
   INICIAR
========================================================= */

function startGame() {

    score = 0;

    coins = 0;

    lives = 3;

    gameTime = 0;

    bullets = [];

    enemies = [];

    bossBullets = [];

    boss = null;

    evolutionStage = 0;

    maxUpgradeLimit = 3;

    nextBossScoreThreshold = 5000;

    upgrades.bullets = 0;

    upgrades.speed = 1;

    player.x =
        canvas.width / 2 -
        player.width / 2;


    document
        .getElementById('scoreVal')
        .textContent = score;


    document
        .getElementById('upgEvolve')
        .style.display = 'none';


    document
        .getElementById('saveScoreSection')
        .style.display = 'block';


    document
        .getElementById('playerInitials')
        .value = 'AAA';


    updateLivesUI();

    updateUpgradesHUD();


    document
        .getElementById('startScreen')
        .style.display = 'none';


    document
        .getElementById('gameOverScreen')
        .style.display = 'none';


    gameState = 'PLAYING';


    if (window.gameTimerInterval)
        clearInterval(window.gameTimerInterval);


    window.gameTimerInterval =
        setInterval(() => {

            if (gameState === 'PLAYING') {

                gameTime++;

            }

        }, 1000);

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    gameState = 'GAMEOVER';

    clearInterval(
        window.gameTimerInterval
    );


    document
        .getElementById('finalScore')
        .textContent = score;


    renderLeaderboard(
        'endLeaderboardList'
    );


    document
        .getElementById('gameOverScreen')
        .style.display = 'flex';

}


/* =========================================================
   ACTUALIZACIÓN DEL JUEGO
========================================================= */

let enemySpawnInterval = 0;


function update() {

    if (gameState !== 'PLAYING')
        return;


    if (
        score >= nextBossScoreThreshold &&
        !boss
    ) {

        spawnBoss();

        nextBossScoreThreshold += 5000;

    }


    let currentSpeed =
        player.baseSpeed +
        (upgrades.speed - 1) * 0.5;


    if (
        keys.ArrowLeft ||
        keys.KeyA
    ) {

        player.x -= currentSpeed;

    }


    if (
        keys.ArrowRight ||
        keys.KeyD
    ) {

        player.x += currentSpeed;

    }


    if (player.x < 10)
        player.x = 10;


    if (
        player.x >
        canvas.width -
        player.width -
        10
    ) {

        player.x =
            canvas.width -
            player.width -
            10;

    }


    for (let s of stars) {

        s.y += s.speed;

        if (s.y > canvas.height) {

            s.y = 0;

            s.x =
                Math.random() *
                canvas.width;

        }

    }


    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        bullets[i].y -=
            bullets[i].speed;


        if (bullets[i].dx)
            bullets[i].x +=
                bullets[i].dx;


        if (bullets[i].y < -20)
            bullets.splice(i, 1);

    }


    for (
        let i = bossBullets.length - 1;
        i >= 0;
        i--
    ) {

        bossBullets[i].y +=
            bossBullets[i].speed;


        if (
            bossBullets[i].y >
            canvas.height + 20
        ) {

            bossBullets.splice(i, 1);

            continue;

        }


        if (
            player.x <
            bossBullets[i].x +
            bossBullets[i].width &&

            player.x +
            player.width >
            bossBullets[i].x &&

            player.y <
            bossBullets[i].y +
            bossBullets[i].height &&

            player.y +
            player.height >
            bossBullets[i].y
        ) {

            bossBullets.splice(i, 1);

            lives--;

            updateLivesUI();

            if (lives <= 0)
                gameOver();

        }

    }


    if (!boss) {

        enemySpawnInterval++;

        let spawnLimit =
            Math.max(
                20,
                45 -
                Math.floor(gameTime / 10)
            );


        if (
            enemySpawnInterval >
            spawnLimit
        ) {

            spawnEnemy();

            enemySpawnInterval = 0;

        }

    }


    if (boss) {

        if (boss.y < 50)
            boss.y += 1;


        boss.x +=
            boss.speed *
            boss.direction;


        if (
            boss.x < 10 ||
            boss.x + boss.width >
            canvas.width - 10
        ) {

            boss.direction *= -1;

        }


        boss.shootCooldown++;


        if (
            boss.shootCooldown >= 35
        ) {

            boss.shootCooldown = 0;


            bossBullets.push({

                x:
                    boss.x +
                    boss.width / 2 -
                    6,

                y:
                    boss.y +
                    boss.height,

                width: 12,

                height: 12,

                speed: 5.5

            });

        }

    }


    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        enemies[i].y +=
            enemies[i].speed;


        enemies[i].wobble += 0.05;


        enemies[i].x +=
            Math.sin(
                enemies[i].wobble
            ) * 0.8;


        if (
            enemies[i].y >
            canvas.height
        ) {

            enemies.splice(i, 1);

            lives--;

            updateLivesUI();

            if (lives <= 0)
                gameOver();

            continue;

        }


        if (
            player.x <
            enemies[i].x +
            enemies[i].width &&

            player.x +
            player.width >
            enemies[i].x &&

            player.y <
            enemies[i].y +
            enemies[i].height &&

            player.y +
            player.height >
            enemies[i].y
        ) {

            enemies.splice(i, 1);

            lives--;

            updateLivesUI();

            if (lives <= 0)
                gameOver();

            continue;

        }


        for (
            let j = bullets.length - 1;
            j >= 0;
            j--
        ) {

            if (
                bullets[j] &&

                bullets[j].x <
                enemies[i].x +
                enemies[i].width &&

                bullets[j].x +
                bullets[j].width >
                enemies[i].x &&

                bullets[j].y <
                enemies[i].y +
                enemies[i].height &&

                bullets[j].y +
                bullets[j].height >
                enemies[i].y
            ) {

                enemies[i].hp -=
                    bullets[j].damage;


                bullets.splice(j, 1);


                if (
                    enemies[i].hp <= 0
                ) {

                    score += 100;

                    coins += 1;


                    document
                        .getElementById('scoreVal')
                        .textContent = score;


                    updateUpgradesHUD();


                    enemies.splice(i, 1);

                }

                break;

            }

        }

    }


    if (boss) {

        for (
            let j = bullets.length - 1;
            j >= 0;
            j--
        ) {

            if (
                bullets[j] &&

                bullets[j].x <
                boss.x +
                boss.width &&

                bullets[j].x +
                bullets[j].width >
                boss.x &&

                bullets[j].y <
                boss.y +
                boss.height &&

                bullets[j].y +
                bullets[j].height >
                boss.y
            ) {

                boss.hp -=
                    bullets[j].damage;


                bullets.splice(j, 1);


                if (boss.hp <= 0) {

                    score += 1500;

                    coins += 15;


                    document
                        .getElementById('scoreVal')
                        .textContent = score;


                    updateUpgradesHUD();


                    boss = null;

                    break;

                }

            }

        }

    }

}

/* Rectángulo redondeado compatible */
function roundedRect(
    x,
    y,
    w,
    h,
    r
) {

    const radius =
        Math.min(
            r,
            w / 2,
            h / 2
        );


    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + w - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + w,
        y,
        x + w,
        y + radius
    );

    ctx.lineTo(
        x + w,
        y + h - radius
    );

    ctx.quadraticCurveTo(
        x + w,
        y + h,
        x + w - radius,
        y + h
    );

    ctx.lineTo(
        x + radius,
        y + h
    );

    ctx.quadraticCurveTo(
        x,
        y + h,
        x,
        y + h - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

}


/* =========================================================
   PROPULSORES
========================================================= */

function drawThruster(
    x,
    y,
    size,
    color
) {

    const gradient =
        ctx.createLinearGradient(
            x,
            y,
            x,
            y + size
        );


    gradient.addColorStop(
        0,
        '#ffffff'
    );

    gradient.addColorStop(
        0.35,
        color
    );

    gradient.addColorStop(
        1,
        'rgba(0,0,0,0)'
    );


    ctx.fillStyle = gradient;


    ctx.beginPath();

    ctx.moveTo(
        x - size / 2,
        y
    );

    ctx.lineTo(
        x + size / 2,
        y
    );

    ctx.lineTo(
        x,
        y + size
    );

    ctx.closePath();

    ctx.fill();

}

}

   JEFE 2.0
========================================================= */

function drawBoss(b) {

    ctx.save();

    ctx.translate(
        b.x,
        b.y
    );


    /* Aura */

    const aura =
        ctx.createRadialGradient(
            60,
            48,
            15,
            60,
            48,
            85
        );

    aura.addColorStop(
        0,
        'rgba(250,204,21,0.25)'
    );

    aura.addColorStop(
        1,
        'rgba(250,204,21,0)'
    );


    ctx.fillStyle = aura;

    ctx.beginPath();

    ctx.arc(
        60,
        48,
        85,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Hojas */

    ctx.fillStyle =
        '#15803d';


    ctx.beginPath();

    ctx.moveTo(
        25,
        85
    );

    ctx.quadraticCurveTo(
        -10,
        105,
        20,
        55
    );

    ctx.lineTo(
        45,
        82
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        95,
        85
    );

    ctx.quadraticCurveTo(
        130,
        105,
        100,
        55
    );

    ctx.lineTo(
        75,
        82
    );

    ctx.closePath();

    ctx.fill();


    /* Cuerpo gigante */

    const bossGradient =
        ctx.createLinearGradient(
            0,
            5,
            0,
            95
        );

    bossGradient.addColorStop(
        0,
        '#fde047'
    );

    bossGradient.addColorStop(
        0.5,
        '#eab308'
    );

    bossGradient.addColorStop(
        1,
        '#a16207'
    );


    ctx.fillStyle =
        bossGradient;


    ctx.beginPath();

    ctx.ellipse(
        60,
        50,
        55,
        46,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.strokeStyle =
        '#713f12';

    ctx.lineWidth = 4;

    ctx.stroke();


    /* Granos */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        'rgba(161,98,7,0.38)';


    for (let row = 0; row < 4; row++) {

        for (let col = 0; col < 5; col++) {

            let gx =
                30 +
                col * 15 +
                (row % 2 ? 7 : 0);

            let gy =
                18 +
                row * 17;


            ctx.beginPath();

            ctx.arc(
                gx,
                gy,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

    }


    /* Corona / cresta */

    ctx.fillStyle =
        '#dc2626';


    ctx.beginPath();

    ctx.arc(
        34,
        10,
        10,
        Math.PI,
        0
    );

    ctx.arc(
        60,
        4,
        13,
        Math.PI,
        0
    );

    ctx.arc(
        86,
        10,
        10,
        Math.PI,
        0
    );

    ctx.fill();


    /* Cejas */

    ctx.strokeStyle =
        '#450a0a';

    ctx.lineWidth = 6;

    ctx.beginPath();

    ctx.moveTo(
        20,
        32
    );

    ctx.lineTo(
        48,
        25
    );

    ctx.moveTo(
        72,
        25
    );

    ctx.lineTo(
        100,
        32
    );

    ctx.stroke();


    /* Ojos */

    ctx.fillStyle =
        '#ffffff';


    ctx.beginPath();

    ctx.arc(
        37,
        38,
        11,
        0,
        Math.PI * 2
    );

    ctx.arc(
        83,
        38,
        11,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        '#111827';


    ctx.beginPath();

    ctx.arc(
        37,
        38,
        5,
        0,
        Math.PI * 2
    );

    ctx.arc(
        83,
        38,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Boca */

    ctx.fillStyle =
        '#450a0a';


    ctx.beginPath();

    ctx.ellipse(
        60,
        68,
        25,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Dientes */

    ctx.fillStyle =
        '#fff7ed';


    for (let i = 0; i < 5; i++) {

        ctx.beginPath();

        ctx.moveTo(
            42 + i * 9,
            64
        );

        ctx.lineTo(
            46 + i * 9,
            73
        );

        ctx.lineTo(
            50 + i * 9,
            64
        );

        ctx.closePath();

        ctx.fill();

    }


    /* Barra de vida */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        '#020617';

    roundedRect(
        10,
        -16,
        b.width - 20,
        9,
        4
    );

    ctx.fill();


    ctx.fillStyle =
        '#ef4444';

    roundedRect(
        10,
        -16,
        (b.width - 20) *
        (b.hp / b.maxHp),
        9,
        4
    );

    ctx.fill();


    ctx.strokeStyle =
        '#f8fafc';

    ctx.lineWidth = 1;

    roundedRect(
        10,
        -16,
        b.width - 20,
        9,
        4
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   PROYECTILES VISUALES
========================================================= */

function drawBullet(b) {

    ctx.save();

    ctx.translate(
        b.x + b.width / 2,
        b.y + b.height / 2
    );


    /* Brillo */

    ctx.shadowBlur = 12;


    if (b.type === 'chick') {

        ctx.shadowColor =
            '#f97316';

        ctx.fillStyle =
            '#fbbf24';


        /* Pollito */

        ctx.beginPath();

        ctx.arc(
            0,
            1,
            7,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            '#ef4444';

        ctx.beginPath();

        ctx.arc(
            -2,
            -7,
            2.5,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            '#f97316';

        ctx.beginPath();

        ctx.moveTo(
            6,
            0
        );

        ctx.lineTo(
            12,
            3
        );

        ctx.lineTo(
            6,
            5
        );

        ctx.closePath();

        ctx.fill();

    }


    else if (b.type === 'wool') {

        ctx.shadowColor =
            '#ffffff';

        ctx.strokeStyle =
            '#e2e8f0';

        ctx.lineWidth = 4;


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            6,
            0,
            Math.PI * 1.7
        );

        ctx.stroke();


        ctx.strokeStyle =
            '#ffffff';

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            3,
            0,
            Math.PI * 1.7
        );

        ctx.stroke();

    }


    else if (b.type === 'horseshoe') {

        ctx.shadowColor =
            '#fbbf24';

        ctx.strokeStyle =
            '#fbbf24';

        ctx.lineWidth = 4;


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            7,
            0.2,
            Math.PI * 1.8
        );

        ctx.stroke();


        ctx.fillStyle =
            '#92400e';

        ctx.fillRect(
            -7,
            -2,
            3,
            4
        );

        ctx.fillRect(
            4,
            -2,
            3,
            4
        );

    }


    else if (b.type === 'milk') {

        ctx.shadowColor =
            '#67e8f9';

        ctx.fillStyle =
            '#f8fafc';


        roundedRect(
            -5,
            -7,
            10,
            14,
            2
        );

        ctx.fill();


        ctx.fillStyle =
            '#38bdf8';

        ctx.fillRect(
            -5,
            -2,
            10,
            3
        );


        ctx.fillStyle =
            '#bae6fd';

        ctx.fillRect(
            -3,
            -9,
            6,
            3
        );

    }


    ctx.restore();

}


/* =========================================================
   PROYECTIL DEL JEFE
========================================================= */

function drawBossBullet(bb) {

    ctx.save();

    ctx.translate(
        bb.x + bb.width / 2,
        bb.y + bb.height / 2
    );


    ctx.shadowColor =
        '#facc15';

    ctx.shadowBlur = 10;


    /* Mazorca */

    ctx.fillStyle =
        '#fde047';


    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        5,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Granos */

    ctx.fillStyle =
        '#ca8a04';


    for (let i = -4; i <= 4; i += 4) {

        ctx.beginPath();

        ctx.arc(
            -2,
            i,
            1.2,
            0,
            Math.PI * 2
        );

        ctx.arc(
            2,
            i,
            1.2,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* Hojas */

    ctx.fillStyle =
        '#16a34a';


    ctx.beginPath();

    ctx.moveTo(
        -3,
        7
    );

    ctx.lineTo(
        -8,
        10
    );

    ctx.lineTo(
        -2,
        3
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        3,
        7
    );

    ctx.lineTo(
        8,
        10
    );

    ctx.lineTo(
        2,
        3
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   FONDO ESPACIAL MEJORADO
========================================================= */

function drawBackground() {

    /* Fondo */

    const bg =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );


    bg.addColorStop(
        0,
        '#020617'
    );

    bg.addColorStop(
        0.5,
        '#0b1120'
    );

    bg.addColorStop(
        1,
        '#111827'
    );


    ctx.fillStyle =
        bg;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Nebulosas */

    const glow1 =
        ctx.createRadialGradient(
            80,
            180,
            0,
            80,
            180,
            150
        );


    glow1.addColorStop(
        0,
        'rgba(56,189,248,0.08)'
    );

    glow1.addColorStop(
        1,
        'rgba(56,189,248,0)'
    );


    ctx.fillStyle =
        glow1;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const glow2 =
        ctx.createRadialGradient(
            350,
            430,
            0,
            350,
            430,
            170
        );


    glow2.addColorStop(
        0,
        'rgba(168,85,247,0.07)'
    );

    glow2.addColorStop(
        1,
        'rgba(168,85,247,0)'
    );


    ctx.fillStyle =
        glow2;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Estrellas */

    for (let s of stars) {

        ctx.globalAlpha =
            s.alpha;

        ctx.fillStyle =
            '#e2e8f0';


        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.globalAlpha = 1;

}


/* =========================================================
   DIBUJAR TODO
========================================================= */

function draw() {

    drawBackground();


    if (boss)
        drawBoss(boss);


    drawPlayerShip(
        player.x,
        player.y
    );


    for (let b of bullets) {

        drawBullet(b);

    }


    for (let bb of bossBullets) {

        drawBossBullet(bb);

    }


    for (let e of enemies) {

        drawEvilCorn(e);

    }

}


/* =========================================================
   LOOP
========================================================= */

function loop() {

    update();

    draw();

    requestAnimationFrame(loop);

}


/* =========================================================
   INICIO
========================================================= */

renderLeaderboard(
    'startLeaderboardList'
);

loop();

</script>
