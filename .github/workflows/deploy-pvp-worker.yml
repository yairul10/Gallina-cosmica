name: Desplegar Worker PvP

on:
  push:
    branches:
      - main
    paths:
      - 'pvp-server/**'
      - '.github/workflows/deploy-pvp-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pvp-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Desplegar gallina-cosmica-pvp-test
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Desplegar Worker PvP
        working-directory: pvp-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
