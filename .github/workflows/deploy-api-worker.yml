name: Desplegar Worker API (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/api-security-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar configuración y generar Wrangler
        working-directory: api-server
        run: |
          node -e 'const fs=require("fs");const id="1e0ae124-f0c0-4bf1-8c7d-cb50c039ac44";if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id))throw Error("ID de D1 inválido");fs.writeFileSync("wrangler.deploy.json",JSON.stringify({name:"gallina-cosmica-api",main:"src/worker.js",compatibility_date:"2026-10-03",keep_vars:true,d1_databases:[{binding:"DB",database_name:"gallina-cosmica-db",database_id:id}]}));'

      - name: Desplegar Worker API
        working-directory: api-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.deploy.json
