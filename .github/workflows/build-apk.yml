name: Crear AAB de Gallina Cosmica

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar juego
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npm install @capacitor/splash-screen@8
          npm install @capacitor-community/admob@8
          # Google Play Billing 9.1.0 se agrega al proyecto Android después de crear Capacitor.
          npm install --save-dev @capacitor/assets

      - name: Preparar juego
        run: |
          mkdir -p www
          cp index.html www/
          cp -r js www/
          cp style.css www/
          cp -r assets www/

      - name: Preparar imágenes
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          import os

          os.makedirs("assets", exist_ok=True)

          if os.path.exists("assets/icon.png"):
              icon = Image.open("assets/icon.png").convert("RGBA")
              icon = icon.resize((1024, 1024), Image.Resampling.LANCZOS)
              icon.save("assets/icon-only.png")
              icon.save("assets/icon-foreground.png")
              background = Image.new("RGBA", (1024, 1024), (0, 0, 0, 255))
              background.save("assets/icon-background.png")

          if os.path.exists("assets/splash.png"):
              splash = Image.open("assets/splash.png").convert("RGB")
              splash = splash.resize((2732, 2732), Image.Resampling.LANCZOS)
              splash.save("assets/splash.png", quality=100)
              splash.save("assets/splash-dark.png", quality=100)
          PY

      - name: Crear proyecto Android
        run: |
          npx cap init "Gallina Cosmica" "com.gallinacosmica.app" --web-dir www
          npx cap add android

      - name: Configurar Google Play Billing
        run: |
          python3 - <<'PYBILLING'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()
          dep = '    implementation "com.android.billingclient:billing:9.1.0"\n'
          if "com.android.billingclient:billing:" not in s:
              marker = "dependencies {"
              pos = s.find(marker)
              if pos < 0:
                  raise RuntimeError("No se encontro dependencies en android/app/build.gradle")
              insert = pos + len(marker)
              s = s[:insert] + "\n" + dep + s[insert:]
          p.write_text(s)

          if "com.android.billingclient:billing:9.1.0" not in p.read_text():
              raise RuntimeError("Google Play Billing 9.1.0 no fue agregado")
          PYBILLING

      - name: Crear puente nativo Google Play Billing
        run: |
          cat > android/app/src/main/java/com/gallinacosmica/app/GallinaBillingPlugin.java <<'JAVA'
          package com.gallinacosmica.app;

          import com.getcapacitor.*;
          import com.getcapacitor.annotation.*;
          import com.android.billingclient.api.*;
          import java.util.*;

          @CapacitorPlugin(name = "GallinaBilling")
          public class GallinaBillingPlugin extends Plugin implements PurchasesUpdatedListener {
              private BillingClient client;
              private PluginCall pendingBuy;

              private void connect(final Runnable ready, final PluginCall call) {
                  if (client == null) {
                      PendingPurchasesParams pending = PendingPurchasesParams.newBuilder().enableOneTimeProducts().build();
                      client = BillingClient.newBuilder(getContext()).setListener(this).enablePendingPurchases(pending).build();
                  }
                  if (client.isReady()) { ready.run(); return; }
                  client.startConnection(new BillingClientStateListener() {
                      public void onBillingSetupFinished(BillingResult r) {
                          if (r.getResponseCode()==BillingClient.BillingResponseCode.OK) ready.run();
                          else call.reject("Google Play Billing no disponible: "+r.getDebugMessage());
                      }
                      public void onBillingServiceDisconnected() {}
                  });
              }

              @PluginMethod
              public void buy(PluginCall call) {
                  String productId=call.getString("productId");
                  if(productId==null){call.reject("Falta productId");return;}
                  connect(() -> queryAndLaunch(productId, call), call);
              }

              private void queryAndLaunch(String productId, PluginCall call) {
                  QueryProductDetailsParams.Product p=QueryProductDetailsParams.Product.newBuilder()
                      .setProductId(productId).setProductType(BillingClient.ProductType.INAPP).build();
                  QueryProductDetailsParams q=QueryProductDetailsParams.newBuilder().setProductList(Collections.singletonList(p)).build();
                  client.queryProductDetailsAsync(q,(result, detailsResult)->{
                      if(result.getResponseCode()!=BillingClient.BillingResponseCode.OK || detailsResult.getProductDetailsList().isEmpty()){
                          call.reject("Producto no disponible en Google Play"); return;
                      }
                      ProductDetails d=detailsResult.getProductDetailsList().get(0);
                      ProductDetails.OneTimePurchaseOfferDetails offer=null;
                      List<ProductDetails.OneTimePurchaseOfferDetails> offers=d.getOneTimePurchaseOfferDetailsList();
                      if(offers!=null && !offers.isEmpty()) offer=offers.get(0);
                      BillingFlowParams.ProductDetailsParams.Builder pb=BillingFlowParams.ProductDetailsParams.newBuilder().setProductDetails(d);
                      if(offer!=null && offer.getOfferToken()!=null) pb.setOfferToken(offer.getOfferToken());
                      BillingFlowParams flow=BillingFlowParams.newBuilder().setProductDetailsParamsList(Collections.singletonList(pb.build())).build();
                      pendingBuy=call;
                      BillingResult launch=client.launchBillingFlow(getActivity(),flow);
                      if(launch.getResponseCode()!=BillingClient.BillingResponseCode.OK){pendingBuy=null;call.reject("No se pudo abrir Google Play: "+launch.getDebugMessage());}
                  });
              }

              public void onPurchasesUpdated(BillingResult result, List<Purchase> purchases) {
                  if(pendingBuy==null)return;
                  PluginCall call=pendingBuy; pendingBuy=null;
                  if(result.getResponseCode()==BillingClient.BillingResponseCode.USER_CANCELED){call.reject("Compra cancelada");return;}
                  if(result.getResponseCode()!=BillingClient.BillingResponseCode.OK || purchases==null || purchases.isEmpty()){call.reject("Compra no completada: "+result.getDebugMessage());return;}
                  Purchase p=purchases.get(0);
                  if(p.getPurchaseState()!=Purchase.PurchaseState.PURCHASED){call.reject("Compra pendiente o no completada");return;}
                  JSObject out=new JSObject(); out.put("purchaseToken",p.getPurchaseToken()); out.put("orderId",p.getOrderId()); out.put("products",new JSArray(p.getProducts())); call.resolve(out);
              }

              @PluginMethod
              public void getProducts(PluginCall call) {
                  JSArray ids=call.getArray("productIds");
                  if(ids==null){call.reject("Faltan productIds");return;}
                  List<QueryProductDetailsParams.Product> products=new ArrayList<>();
                  try {
                      for(Object raw: ids.toList()){
                          String id=String.valueOf(raw);
                          products.add(QueryProductDetailsParams.Product.newBuilder().setProductId(id).setProductType(BillingClient.ProductType.INAPP).build());
                      }
                  } catch(Exception e){call.reject("productIds inválidos");return;}
                  connect(() -> {
                      QueryProductDetailsParams q=QueryProductDetailsParams.newBuilder().setProductList(products).build();
                      client.queryProductDetailsAsync(q,(r,detailsResult)->{
                          if(r.getResponseCode()!=BillingClient.BillingResponseCode.OK){call.reject("No se pudieron consultar los productos: "+r.getDebugMessage());return;}
                          JSArray out=new JSArray();
                          for(ProductDetails d: detailsResult.getProductDetailsList()){
                              JSObject item=new JSObject(); item.put("productId",d.getProductId());
                              List<ProductDetails.OneTimePurchaseOfferDetails> offers=d.getOneTimePurchaseOfferDetailsList();
                              if(offers!=null && !offers.isEmpty()) item.put("formattedPrice",offers.get(0).getFormattedPrice());
                              out.put(item);
                          }
                          JSObject result=new JSObject(); result.put("products",out); call.resolve(result);
                      });
                  }, call);
              }

              @PluginMethod
              public void getPurchases(PluginCall call) {
                  connect(() -> {
                      QueryPurchasesParams q=QueryPurchasesParams.newBuilder().setProductType(BillingClient.ProductType.INAPP).build();
                      client.queryPurchasesAsync(q,(r,purchases)->{
                          if(r.getResponseCode()!=BillingClient.BillingResponseCode.OK){call.reject("No se pudieron recuperar compras: "+r.getDebugMessage());return;}
                          JSArray out=new JSArray();
                          for(Purchase p:purchases){
                              if(p.getPurchaseState()!=Purchase.PurchaseState.PURCHASED) continue;
                              JSObject item=new JSObject();
                              item.put("purchaseToken",p.getPurchaseToken());
                              item.put("products",new JSArray(p.getProducts()));
                              out.put(item);
                          }
                          JSObject result=new JSObject(); result.put("purchases",out); call.resolve(result);
                      });
                  }, call);
              }

              @PluginMethod
              public void consume(PluginCall call) {
                  String token=call.getString("purchaseToken");
                  if(token==null){call.reject("Falta purchaseToken");return;}
                  connect(() -> {
                      ConsumeParams cp=ConsumeParams.newBuilder().setPurchaseToken(token).build();
                      client.consumeAsync(cp,(r,t)->{if(r.getResponseCode()==BillingClient.BillingResponseCode.OK)call.resolve();else call.reject("No se pudo consumir la compra: "+r.getDebugMessage());});
                  }, call);
              }
          }
          JAVA
          # MainActivity se configura después de Play Games, porque ese script
          # es quien crea el onCreate de la app. Aquí solo generamos el plugin Billing.

      - name: Configurar AdMob de prueba
        run: |
          python3 - <<'PYADMOB'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          tag = """        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />
          """
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              pos = s.find("<application")
              end = s.find(">", pos)
              if pos < 0 or end < 0:
                  raise RuntimeError("No se encontro <application> en AndroidManifest.xml")
              s = s[:end + 1] + "\n" + tag + s[end + 1:]
          manifest.write_text(s)

          strings = Path("android/app/src/main/res/values/strings.xml")
          x = strings.read_text()
          if 'name="admob_app_id"' not in x:
              x = x.replace("</resources>", '    <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>\\n</resources>')
          strings.write_text(x)

          # Fallar el build antes de generar el AAB si el App ID no quedo realmente en el manifest.
          final_manifest = manifest.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in final_manifest:
              raise RuntimeError("AdMob APPLICATION_ID no fue insertado en AndroidManifest.xml")
          if "ca-app-pub-3940256099942544~3347511713" not in strings.read_text():
              raise RuntimeError("AdMob test App ID no fue insertado en strings.xml")
          PYADMOB

      - name: Generar icono
        run: |
          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor "#000000" \
            --iconBackgroundColorDark "#000000" \
            --splashBackgroundColor "#000000" \
            --splashBackgroundColorDark "#000000"

      - name: Sincronizar Capacitor
        run: |
          npx cap sync android

      - name: Configurar Play Games Services v2
        run: python3 scripts/configure_play_games.py

      - name: Registrar plugin Google Play Billing
        run: |
          python3 - <<'PYREGISTER'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/gallinacosmica/app/MainActivity.java")
          s = p.read_text()
          line = "        registerPlugin(GallinaBillingPlugin.class);"
          if "registerPlugin(GallinaBillingPlugin.class)" not in s:
              marker = "registerPlugin(PlayGamesPlugin.class);"
              if marker not in s:
                  raise RuntimeError("No se encontro el onCreate configurado por Play Games")
              s = s.replace(marker, marker + "\n" + line, 1)
          p.write_text(s)
          PYREGISTER

      - name: Configurar version de la app
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", "versionCode 68")
          s = s.replace('versionName "1.0"', 'versionName "1.4.38"')
          p.write_text(s)
          PY2

      - name: Configurar firma de Google Play
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/gallina-cosmica-upload.jks

          python3 - <<'PY2'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()
          signing = """
          signingConfigs {
              release {
                  storeFile file("gallina-cosmica-upload.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
              }
          }
          """

          text = text.replace(
              "buildTypes {",
              signing + "\nbuildTypes {",
              1
          )
          build_types = text.index("buildTypes {")
          release = text.index("release {", build_types)
          line_start = text.rfind("\n", 0, release) + 1
          indent = text[line_start:release]
          line_end = text.index("\n", release) + 1
          text = (
              text[:line_end]
              + indent
              + "    signingConfig signingConfigs.release\n"
              + text[line_end:]
          )

          p.write_text(text)
          PY2

      - name: Compilar AAB y APK Release y mostrar reporte de firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport bundleRelease assembleRelease

      - name: Verificar que el AAB esté firmado
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"

          echo "=== Archivos de firma dentro del AAB ==="
          unzip -l "$AAB" | grep -E 'META-INF/.*\.(RSA|DSA|EC)$' || {
            echo "ERROR: El AAB no contiene archivos de firma."
            exit 1
          }

          echo "=== Verificación jarsigner ==="
          jarsigner -verify -verbose -certs "$AAB" > /tmp/jarsigner.txt 2>&1 || {
            cat /tmp/jarsigner.txt
            exit 1
          }
          cat /tmp/jarsigner.txt

          if grep -qi "jar is unsigned" /tmp/jarsigner.txt || ! grep -qi "jar verified" /tmp/jarsigner.txt; then
            echo "ERROR: No se pudo confirmar la firma del AAB."
            exit 1
          fi

          echo "OK: AAB firmado correctamente."

      - name: Verificar que el APK esté generado
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || {
            echo "ERROR: No se generó el APK Release."
            exit 1
          }
          echo "OK: APK Release generado correctamente."

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Gallina-Cosmica-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Guardar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Gallina-Cosmica-APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk
