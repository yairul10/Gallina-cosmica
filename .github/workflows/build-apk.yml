name: Crear APK de Gallina Cosmica

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar juego
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar herramientas de imágenes
        run: |
          python3 -m pip install Pillow

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/splash-screen

      - name: Preparar aplicación web
        run: |
          mkdir -p www
          cp index.html www/
          cp game.js www/
          cp style.css www/
          cp -r assets www/

      - name: Configurar Capacitor
        run: |
          npx cap init "Gallina Cosmica" "com.gallinacosmica.app" --web-dir www
          npx cap add android

      - name: Configurar icono y splash
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp assets/splash.png android/app/src/main/res/drawable/splash.png

          python3 - <<'PY'
          from PIL import Image
          import os

          img = Image.open("assets/icon.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)

              resized = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(f"{path}/icon.png")
              resized.save(f"{path}/ic_launcher.png")
              resized.save(f"{path}/ic_launcher_round.png")
          PY

      - name: Configurar pantalla de inicio
        run: |
          cat > android/app/src/main/res/drawable/splash_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">

              <item>
                  <color android:color="#000000"/>
              </item>

              <item>
                  <bitmap
                      android:src="@drawable/splash"
                      android:gravity="center"
                      android:tileMode="disabled"/>
              </item>

          </layer-list>
          EOF

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowBackground">
                      @drawable/splash_background
                  </item>

              </style>

          </resources>
          EOF

      - name: Configurar icono de la aplicación
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"

          tree = ET.parse(path)
          root = tree.getroot()

          application = root.find("application")

          if application is not None:
              application.set(
                  "{http://schemas.android.com/apk/res/android}icon",
                  "@mipmap/ic_launcher"
              )

              application.set(
                  "{http://schemas.android.com/apk/res/android}roundIcon",
                  "@mipmap/ic_launcher_round"
              )

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )
          PY

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallina-Cosmica-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
