name: Crear AAB de Gallina Cosmica

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar juego
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npm install @capacitor/splash-screen@8
          npm install --save-dev @capacitor/assets

      - name: Preparar juego
        run: |
          mkdir -p www
          cp index.html www/
          cp -r js www/
          cp style.css www/
          cp -r assets www/

      - name: Preparar imágenes
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          import os

          os.makedirs("assets", exist_ok=True)

          if os.path.exists("assets/icon.png"):
              icon = Image.open("assets/icon.png").convert("RGBA")
              icon = icon.resize((1024, 1024), Image.Resampling.LANCZOS)
              icon.save("assets/icon-only.png")
              icon.save("assets/icon-foreground.png")
              background = Image.new("RGBA", (1024, 1024), (0, 0, 0, 255))
              background.save("assets/icon-background.png")

          if os.path.exists("assets/splash.png"):
              splash = Image.open("assets/splash.png").convert("RGB")
              splash = splash.resize((2732, 2732), Image.Resampling.LANCZOS)
              splash.save("assets/splash.png", quality=100)
              splash.save("assets/splash-dark.png", quality=100)
          PY

      - name: Crear proyecto Android
        run: |
          npx cap init "Gallina Cosmica" "com.gallinacosmica.app" --web-dir www
          npx cap add android

      - name: Generar icono
        run: |
          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor "#000000" \
            --iconBackgroundColorDark "#000000" \
            --splashBackgroundColor "#000000" \
            --splashBackgroundColorDark "#000000"

      - name: Sincronizar Capacitor
        run: |
          npx cap sync android

      - name: Configurar Play Games Services v2
        run: python3 scripts/configure_play_games.py

      - name: Configurar version de la app
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", "versionCode 6")
          s = s.replace('versionName "1.0"', 'versionName "1.3.1"')
          p.write_text(s)
          PY2

      - name: Configurar firma de Google Play
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/gallina-cosmica-upload.jks

          python3 - <<'PY2'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()
          signing = """
          signingConfigs {
              release {
                  storeFile file("gallina-cosmica-upload.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
              }
          }
          """

          text = text.replace(
              "buildTypes {",
              signing + "\nbuildTypes {",
              1
          )
          build_types = text.index("buildTypes {")
          release = text.index("release {", build_types)
          line_start = text.rfind("\n", 0, release) + 1
          indent = text[line_start:release]
          line_end = text.index("\n", release) + 1
          text = (
              text[:line_end]
              + indent
              + "    signingConfig signingConfigs.release\n"
              + text[line_end:]
          )

          p.write_text(text)
          PY2

      - name: Compilar AAB y APK Release y mostrar reporte de firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport bundleRelease assembleRelease

      - name: Verificar que el AAB esté firmado
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"

          echo "=== Archivos de firma dentro del AAB ==="
          unzip -l "$AAB" | grep -E 'META-INF/.*\.(RSA|DSA|EC)$' || {
            echo "ERROR: El AAB no contiene archivos de firma."
            exit 1
          }

          echo "=== Verificación jarsigner ==="
          jarsigner -verify -verbose -certs "$AAB" > /tmp/jarsigner.txt 2>&1 || {
            cat /tmp/jarsigner.txt
            exit 1
          }
          cat /tmp/jarsigner.txt

          if grep -qi "jar is unsigned" /tmp/jarsigner.txt || ! grep -qi "jar verified" /tmp/jarsigner.txt; then
            echo "ERROR: No se pudo confirmar la firma del AAB."
            exit 1
          fi

          echo "OK: AAB firmado correctamente."

      - name: Verificar que el APK esté generado
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || {
            echo "ERROR: No se generó el APK Release."
            exit 1
          }
          echo "OK: APK Release generado correctamente."

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Gallina-Cosmica-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Guardar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Gallina-Cosmica-APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk
