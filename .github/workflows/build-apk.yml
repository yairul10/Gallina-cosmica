name: Crear AAB de Gallina Cosmica

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar juego
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npm install @capacitor/splash-screen@8
          npm install --save-dev @capacitor/assets

      - name: Preparar juego
        run: |
          mkdir -p www
          cp index.html www/
          cp game.js www/
          cp style.css www/
          cp -r assets www/

      - name: Preparar imágenes
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          import os

          os.makedirs("assets", exist_ok=True)

          if os.path.exists("assets/icon.png"):
              icon = Image.open("assets/icon.png").convert("RGBA")
              icon = icon.resize((1024, 1024), Image.Resampling.LANCZOS)
              icon.save("assets/icon-only.png")
              icon.save("assets/icon-foreground.png")

              background = Image.new("RGBA", (1024, 1024), (0, 0, 0, 255))
              background.save("assets/icon-background.png")

          if os.path.exists("assets/splash.png"):
              splash = Image.open("assets/splash.png").convert("RGB")
              splash = splash.resize((2732, 2732), Image.Resampling.LANCZOS)
              splash.save("assets/splash.png", quality=100)
              splash.save("assets/splash-dark.png", quality=100)
          PY

      - name: Crear proyecto Android
        run: |
          npx cap init "Gallina Cosmica" "com.gallinacosmica.app" --web-dir www
          npx cap add android

      - name: Generar icono
        run: |
          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor "#000000" \
            --iconBackgroundColorDark "#000000" \
            --splashBackgroundColor "#000000" \
            --splashBackgroundColorDark "#000000"

      - name: Sincronizar Capacitor
        run: |
          npx cap sync android

      - name: Configurar version de la app
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", "versionCode 1")
          s = s.replace('versionName "1.0"', 'versionName "1.0"')
          p.write_text(s)
          PY2

      - name: Configurar firma de Google Play
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/gallina-cosmica-upload.jks

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing = '''
          signingConfigs {
              release {
                  storeFile file("gallina-cosmica-upload.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEYSTORE_PASSWORD")
              }
          }

          '''

          text = text.replace("buildTypes {", signing + "buildTypes {", 1)

          text = text.replace(
              "release {\n",
              "release {\n            signingConfig signingConfigs.release\n",
              1
          )

          path.write_text(text)
          PY

      - name: Compilar AAB Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Gallina-Cosmica-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Guardar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Gallina-Cosmica-APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk
