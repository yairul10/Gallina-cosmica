
name: Crear APK de Gallina Cosmica

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar juego
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Preparar aplicación web
        run: |
          mkdir -p www
          cp index.html www/
          cp game.js www/
          cp style.css www/
          cp -r assets www/

      - name: Configurar Capacitor
        run: |
          npx cap init "Gallina Cosmica" "com.gallinacosmica.app" --web-dir www
          npx cap add android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallina-Cosmica-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
